# pinned to the postgres major ci uses
services:
  db:
    image: postgres:16
    container_name: raikiri-db
    environment:
      POSTGRES_USER: raikiri
      POSTGRES_PASSWORD: raikiri
      POSTGRES_DB: raikiri
    ports:
      - "5432:5432"
    volumes:
      - raikiri-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raikiri -d raikiri"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  raikiri-db:
