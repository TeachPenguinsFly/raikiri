name: macos

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# name bash so steps run with -o pipefail
defaults:
  run:
    shell: bash

env:
  UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
  # no detect_leaks: lsan does not exist on darwin-arm64
  ASAN_OPTIONS: strict_string_checks=1

jobs:
  # macos differs in shm backing, preallocate and thread pinning
  macos:
    name: apple-clang / dev-asan
    runs-on: macos-14
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      # profiles/macos-appleclang claims compiler.version=17 and conan does not check it
      - name: Select newest Xcode
        run: |
          latest=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$latest" ]; then sudo xcode-select -s "$latest"; fi
          /usr/bin/clang++ --version

      - name: Install Ninja
        run: brew install ninja

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Conan
        run: pip install --disable-pip-version-check 'conan~=2.31'

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: conan2-macos-appleclang-debug-release-${{ hashFiles('conanfile.py', 'profiles/macos-appleclang') }}
          restore-keys: |
            conan2-macos-appleclang-debug-release-

      - name: Install dependencies
        run: make deps PRESET=dev-asan PROFILE=profiles/macos-appleclang

      - name: Trim Conan cache
        run: conan cache clean "*" --source --build --temp || true

      - name: Configure
        run: cmake --preset dev-asan

      # ninja's default job count can run this runner out of memory
      - name: Build
        run: cmake --build --preset dev-asan --parallel 3

      - name: Test
        run: ctest --preset dev-asan --parallel 2

      # the demo builds the release preset; its latency numbers mean nothing on shared runners
      - name: Demo (sim venue, 10s)
        run: make demo | tee demo.log

      # exec-ring-overruns is not asserted: the broadcast ring drops on a descheduled consumer
      - name: Check demo invariants
        run: |
          grep -q 'fsm-refusals=0' demo.log || { echo "demo: FSM refused a transition"; exit 1; }
          grep -qE 'fills=[1-9][0-9]*' demo.log || { echo "demo: no fills — pipeline did not round-trip"; exit 1; }
