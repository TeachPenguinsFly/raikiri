name: fuzz

on:
  # Two different jobs wearing one workflow. On a PR the run is a smoke test:
  # 60s per target, seeded from the same fixtures the unit tests use, and it
  # must find nothing — it exists to catch the input that a just-changed parser
  # now mishandles, not to explore. The nightly is the one that actually
  # explores, at 900s per target and over a corpus that survives between runs.
  pull_request:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  FUZZ_SECONDS: ${{ github.event_name == 'pull_request' && 60 || 900 }}

jobs:
  fuzz:
    name: ${{ matrix.target }}
    runs-on: ubuntu-24.04
    # 15 min of fuzzing plus a cold clang/libc++ dependency build.
    timeout-minutes: 75
    strategy:
      # A finding in one parser says nothing about the others, and stopping
      # their runs would throw away the corpus growth they had already paid for.
      fail-fast: false
      matrix:
        include:
          - target: bybit_wire_fuzz
            corpus: bybit
          - target: journal_frame_fuzz
            corpus: journal
          - target: decimal_fuzz
            corpus: decimal

    steps:
      - uses: actions/checkout@v4

      # libclang-rt-18-dev is not optional here: it carries
      # libclang_rt.fuzzer-x86_64.a. Without it the CMake feature probe in
      # fuzz/CMakeLists.txt fails its link step, prints "the runtime is
      # missing", and returns — the job would then build nothing and pass.
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build clang-18 libc++-18-dev libc++abi-18-dev libclang-rt-18-dev

      - name: Lower ASLR entropy for sanitizers
        run: sudo sysctl -w vm.mmap_rnd_bits=28

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Conan
        run: pip install --disable-pip-version-check 'conan~=2.31'

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: conan2-${{ runner.os }}-linux-clang18-debug-${{ hashFiles('conanfile.py', 'profiles/linux-clang18') }}
          restore-keys: |
            conan2-${{ runner.os }}-linux-clang18-debug-

      # Not `make deps PRESET=fuzz`. The repo's fuzz preset resolves its
      # toolchain from build/deps/fuzz, which the Makefile fills using
      # profiles/macos-clang-fuzz — a macOS/armv8 profile hard-wired to
      # /opt/homebrew/opt/llvm. That profile is correct locally, where the point
      # is to bypass AppleClang (which ships no libFuzzer runtime), and useless
      # on a Linux runner. profiles/linux-clang18 is the Linux equivalent and is
      # already exercised by build.yml, so the two agree on ABI and libcxx.
      - name: Install dependencies
        run: make deps PRESET=dev-asan PROFILE=profiles/linux-clang18

      - name: Trim Conan cache
        run: conan cache clean "*" --source --build --temp || true

      # The cache variables below are the fuzz preset's, minus its macOS
      # toolchain file; RAIKIRI_BUILD_FUZZ has to be set at configure time
      # because Sanitizers.cmake reads it to decide whether to add
      # -fsanitize=fuzzer-no-link to every first-party object. Coverage on the
      # fuzz target alone leaves the parsers invisible to libFuzzer, and the
      # symptom (millions of execs/sec, a corpus that never grows) reads as a
      # clean run. Tests and benchmarks are off because they are dead weight
      # for this job. Build dir matches the preset's so fuzz/README.md's
      # reproduce instructions still apply to what is uploaded here.
      - name: Configure
        run: |
          cmake -S . -B build/fuzz -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/build/deps/debug/conan_toolchain.cmake" \
            -DCMAKE_BUILD_TYPE=Debug \
            -DRAIKIRI_SANITIZE=address,undefined \
            -DRAIKIRI_BUILD_FUZZ=ON \
            -DRAIKIRI_BUILD_TESTS=OFF \
            -DRAIKIRI_BUILD_BENCH=OFF

      # If the libFuzzer probe declined, fuzz/ contributes no targets and the
      # build below fails with "unknown target" — which is the right outcome,
      # but the message is misleading. Say so first.
      - name: Build
        run: |
          cmake --build build/fuzz --target fuzz_corpus ${{ matrix.target }} || {
            echo "::error::build failed — if the target is unknown, the libFuzzer runtime probe declined (see configure log)"
            exit 1
          }

      # Corpus carry-over only makes sense for the nightly: 60s on a PR cannot
      # meaningfully extend a corpus, and a PR writing to the shared cache would
      # let a branch's inputs leak into main's baseline. fuzz/corpus is
      # gitignored precisely because libFuzzer owns it.
      - name: Restore corpus
        if: github.event_name != 'pull_request'
        uses: actions/cache/restore@v4
        with:
          path: fuzz/corpus/${{ matrix.corpus }}
          key: fuzz-corpus-${{ matrix.target }}-
          restore-keys: |
            fuzz-corpus-${{ matrix.target }}-

      # fuzz_corpus only seeds bybit (from the wire fixtures, each prefixed with
      # its selector byte). The other two start from whatever the cache holds,
      # so their directories have to exist before libFuzzer is handed them.
      - name: Run
        run: |
          mkdir -p fuzz/corpus/${{ matrix.corpus }} fuzz-artifacts
          ./build/fuzz/fuzz/${{ matrix.target }} fuzz/corpus/${{ matrix.corpus }} \
            -max_total_time="$FUZZ_SECONDS" \
            -timeout=25 \
            -rss_limit_mb=4096 \
            -print_final_stats=1 \
            -artifact_prefix=fuzz-artifacts/${{ matrix.target }}-

      # A finding that dies with the runner is a finding thrown away: the input
      # is unreproducible from the log alone, and the corpus that led to it is
      # what makes it cheap to minimise. Both go up together.
      - name: Upload reproducer
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-repro-${{ matrix.target }}-${{ github.run_id }}
          path: |
            fuzz-artifacts/
            fuzz/corpus/${{ matrix.corpus }}/
          if-no-files-found: ignore
          retention-days: 30

      # Saved only on success — a corpus captured mid-crash is not a baseline
      # worth inheriting. The run id makes the key unique so each night writes a
      # new entry that the next night's restore-keys prefix picks up.
      - name: Save corpus
        if: success() && github.event_name != 'pull_request'
        uses: actions/cache/save@v4
        with:
          path: fuzz/corpus/${{ matrix.corpus }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
