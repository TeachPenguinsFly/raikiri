name: build

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# name bash so steps run with -o pipefail
defaults:
  run:
    shell: bash

env:
  # halt_on_error so a ubsan finding fails ctest
  UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
  ASAN_OPTIONS: strict_string_checks=1:detect_stack_use_after_return=1
  TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1

jobs:
  build:
    name: ${{ matrix.compiler }} / ${{ matrix.preset }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc-14
            profile: linux-gcc14
            preset: dev-asan
            deps_type: debug
            apt: gcc-14 g++-14
          - compiler: gcc-14
            profile: linux-gcc14
            preset: rel
            deps_type: relwithdebinfo
            apt: gcc-14 g++-14
          # the libc++ profile needs the libc++ headers and compiler-rt installed
          - compiler: clang-18
            profile: linux-clang18
            preset: dev-asan
            deps_type: debug
            apt: clang-18 libc++-18-dev libc++abi-18-dev libclang-rt-18-dev
          - compiler: clang-18
            profile: linux-clang18
            preset: rel
            deps_type: relwithdebinfo
            apt: clang-18 libc++-18-dev libc++abi-18-dev libclang-rt-18-dev
          # tsan cannot share a binary with asan
          - compiler: clang-18
            profile: linux-clang18
            preset: dev-tsan
            deps_type: debug
            apt: clang-18 libc++-18-dev libc++abi-18-dev libclang-rt-18-dev

    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build ${{ matrix.apt }}

      # sanitizer runtimes abort under the image's default aslr entropy
      - name: Lower ASLR entropy for sanitizers
        run: sudo sysctl -w vm.mmap_rnd_bits=28

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # the profiles are conan 2.x files
      - name: Install Conan
        run: pip install --disable-pip-version-check 'conan~=2.31'

      # the profile is in the key; conan would restore one compiler's packages into another's job
      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: conan2-${{ runner.os }}-${{ matrix.profile }}-${{ matrix.deps_type }}-${{ hashFiles('conanfile.py', format('profiles/{0}', matrix.profile)) }}
          restore-keys: |
            conan2-${{ runner.os }}-${{ matrix.profile }}-${{ matrix.deps_type }}-

      # no conan profile detect: profiles/ pins the toolchain, -pr:a also covers the sbeppc build context
      - name: Install dependencies
        run: make deps PRESET=${{ matrix.preset }} PROFILE=profiles/${{ matrix.profile }}

      - name: Trim Conan cache
        run: conan cache clean "*" --source --build --temp || true

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      # tsan shadow memory limits ctest to 2 jobs on a 16 GB runner
      - name: Test
        run: ctest --preset ${{ matrix.preset }} --parallel 2
