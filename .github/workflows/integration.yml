name: integration

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  # the one job with a real postgres; persisting a journal twice must change nothing
  integration:
    name: gcc-14 / dev-asan + postgres:16
    runs-on: ubuntu-24.04
    timeout-minutes: 75

    # gcc-14/libstdc++11 has conancenter binaries, so openssl is not rebuilt
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: raikiri_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      RAIKIRI_PG_DSN: postgresql://postgres:postgres@localhost:5432/raikiri_ci
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
      ASAN_OPTIONS: strict_string_checks=1:detect_stack_use_after_return=1

    steps:
      - uses: actions/checkout@v4

      # an asan debug build of every test outgrows the runner's free disk
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/local/.ghcup /usr/local/share/boost /usr/local/share/powershell /usr/local/share/chromium \
            /usr/share/swift /usr/lib/jvm /opt/microsoft /opt/google /usr/local/graalvm
          sudo docker image prune --all --force > /dev/null
          df -h /

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build gcc-14 g++-14 postgresql-client

      - name: Lower ASLR entropy for sanitizers
        run: sudo sysctl -w vm.mmap_rnd_bits=28

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Conan
        run: pip install --disable-pip-version-check 'conan~=2.31'

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: conan2-${{ runner.os }}-linux-gcc14-debug-release-${{ hashFiles('conanfile.py', 'profiles/linux-gcc14') }}
          restore-keys: |
            conan2-${{ runner.os }}-linux-gcc14-debug-release-

      - name: Install dependencies
        run: make deps PRESET=dev-asan PROFILE=profiles/linux-gcc14

      - name: Trim Conan cache
        run: conan cache clean "*" --source --build --temp || true

      - name: Apply migrations
        run: psql "$RAIKIRI_PG_DSN" -v ON_ERROR_STOP=1 -f sql/migrations/0001_init.sql

      - name: Configure
        run: cmake --preset dev-asan -DRAIKIRI_SANITIZE_DEBUG=-g1 -DCMAKE_CXX_FLAGS_DEBUG=-g1 -DCMAKE_C_FLAGS_DEBUG=-g1

      - name: Build
        run: cmake --build --preset dev-asan

      - name: Test
        run: ctest --preset dev-asan --parallel 2

      - name: Demo (sim venue, 10s)
        run: make demo | tee demo.log

      - name: Check demo invariants
        run: |
          grep -q 'fsm-refusals=0' demo.log || { echo "demo: FSM refused a transition"; exit 1; }
          grep -qE 'fills=[1-9][0-9]*' demo.log || { echo "demo: no fills — pipeline did not round-trip"; exit 1; }

      # rewind the cursor to zero so every insert of the second drain hits on conflict
      - name: Persist demo journal twice
        run: |
          PERSISTERD=./build/dev-asan/apps/persisterd/persisterd
          "$PERSISTERD" --dir raikiri-data/journal/strategyd --once
          before=$(psql "$RAIKIRI_PG_DSN" -tAc \
            "SELECT count(*) FROM raikiri.order_events")
          psql "$RAIKIRI_PG_DSN" -v ON_ERROR_STOP=1 -c \
            "UPDATE raikiri.persist_cursors SET last_seq = 0 WHERE journal = 'journal'"
          "$PERSISTERD" --dir raikiri-data/journal/strategyd --once
          after=$(psql "$RAIKIRI_PG_DSN" -tAc \
            "SELECT count(*) FROM raikiri.order_events")
          echo "order_events: $before -> $after"
          [ "$before" = "$after" ] || { echo "replay was not idempotent"; exit 1; }
          [ "$before" -gt 0 ] || { echo "demo journal produced no order events"; exit 1; }
