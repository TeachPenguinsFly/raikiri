name: lint

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  # Split out from clang-tidy so a stray brace fails in about a minute instead
  # of after a full dependency install.
  format:
    name: clang-format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Version-pinned on purpose. clang-format's output changes between
      # releases (IncludeBlocks: Regroup and SeparateDefinitionBlocks have both
      # moved), so an unpinned CI would reformat what a contributor's
      # `make fmt` had just formatted, forever.
      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-format-18

      # Whole tree, not changed files: formatting is cheap to check and a
      # partial sweep leaves the repo permanently half-formatted.
      - name: Check formatting
        run: git ls-files '*.hpp' '*.cpp' | xargs clang-format-18 --dry-run --Werror

  # The layering rule this encodes: a strategy sees the domain types and the
  # strategy API, and nothing else. It must not know which venue it is trading
  # on, nor that the events reaching it crossed a process boundary — that is
  # what lets the same strategy run against the sim venue, against Bybit, and
  # inside a replay harness without a recompile of its logic.
  #
  # grep rather than a build-level enforcement because the interesting failure
  # is textual and early: someone reaches for raikiri/shm/records.hpp to peek at
  # a ring, the include compiles, the coupling is permanent. A link-level check
  # would only catch it once the header stopped being header-only.
  #
  # apps/strategyd is deliberately out of scope: the kernel process is exactly
  # the layer that is supposed to own the transport and hand strategies typed
  # events. It is the boundary, not a resident of it.
  layering:
    name: include layering
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Strategies see domain + strategy API only
        run: |
          # portfolio is on the list because it links domain alone: it holds no
          # transport and no venue knowledge, so it cannot leak either into a
          # strategy. The rule being protected is that a strategy must not know
          # which venue it trades or that events crossed a process boundary.
          allowed='raikiri/(domain|strategy|strategies|common|portfolio)/'
          bad=$(grep -rnE '#[[:space:]]*include[[:space:]]*[<"]raikiri/' \
                  libs/strategy libs/strategies | grep -vE "$allowed" || true)
          if [ -n "$bad" ]; then
            echo "::error::strategy layer includes a header outside domain/strategy/common"
            echo "$bad"
            exit 1
          fi

          # Same rule at the CMake level, so an INTERFACE target cannot acquire
          # a venue or transport dependency that its headers have not yet used.
          badlink=$(grep -nE 'raikiri::(venue_[A-Za-z0-9_]+|net|shm|exec|journal|oms|persist|simcore|config)' \
                      libs/strategy/CMakeLists.txt libs/strategies/CMakeLists.txt || true)
          if [ -n "$badlink" ]; then
            echo "::error::strategy layer links a venue or transport target"
            echo "$badlink"
            exit 1
          fi
          echo "layering ok"

  # clang-tidy over the whole tree is several minutes of runner time on every
  # push to re-report findings nobody introduced. Changed files only keeps the
  # signal attached to the commit that caused it.
  tidy:
    name: clang-tidy (changed files)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          # The diff needs a real history and, on a PR, the base branch.
          fetch-depth: 0

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build clang-18 clang-tidy-18 libc++-18-dev libc++abi-18-dev

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Conan
        run: pip install --disable-pip-version-check 'conan~=2.31'

      # Key is byte-identical to build.yml's clang-18 / rel entry so this job
      # rides that cache instead of paying for its own libc++ dependency build.
      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: conan2-${{ runner.os }}-linux-clang18-relwithdebinfo-${{ hashFiles('conanfile.py', 'profiles/linux-clang18') }}
          restore-keys: |
            conan2-${{ runner.os }}-linux-clang18-relwithdebinfo-

      # clang-tidy needs compile commands, and they have to be clang's: a
      # gcc-generated compile_commands.json carries flags clang's driver rejects.
      - name: Install dependencies
        run: make deps PRESET=rel PROFILE=profiles/linux-clang18

      - name: Configure
        run: cmake --preset rel

      # libs/schema's SBE codecs are generated by sbeppc at build time and never
      # checked in, so any TU that includes raikiri_journal.hpp does not parse
      # until this target has run. Cheaper than a full build, and everything
      # else clang-tidy needs is a header.
      - name: Generate SBE codecs
        run: cmake --build --preset rel --target raikiri_schema_gen

      - name: Collect changed files
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="origin/${{ github.base_ref }}...HEAD"
          else
            before="${{ github.event.before }}"
            if [ -z "$before" ] || ! git cat-file -e "${before}^{commit}" 2>/dev/null; then
              before=$(git rev-parse HEAD~1)
            fi
            range="${before}..HEAD"
          fi
          git diff --name-only --diff-filter=ACMR "$range" > changed.txt || true

          # Headers have no compile command of their own; .clang-tidy's
          # HeaderFilterRegex reaches them through an including TU instead. So a
          # touched header pulls in its own library's sources. Header-only libs
          # (strategy, strategies, observ, schema) have no sources and are the
          # known gap — their consumers' tests cover them on the next change.
          {
            grep -E '\.cpp$' changed.txt || true
            grep -E '^libs/[^/]+/include/.*\.hpp$' changed.txt | \
              sed -E 's|^(libs/[^/]+)/include/.*|\1/src|' | sort -u | \
              while read -r dir; do ls "$dir"/*.cpp 2>/dev/null || true; done
          # `grep -v` exits 1 when it selects nothing, which under pipefail
          # would turn "no relevant files changed" into a failed job.
          } | { grep -vE '^fuzz/' || true; } | sort -u > tidy-files.txt

          echo "count=$(wc -l < tidy-files.txt)" >> "$GITHUB_OUTPUT"
          cat tidy-files.txt

      # --warnings-as-errors is what makes this a gate: clang-tidy exits 0 when
      # it has only warnings, and without the flag the job is decorative.
      - name: Run clang-tidy
        if: steps.changed.outputs.count != '0'
        run: |
          xargs -r -a tidy-files.txt \
            clang-tidy-18 -p build/rel --quiet --warnings-as-errors='*'
