name: lint

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  format:
    name: clang-format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # pinned: clang-format output changes between releases
      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-format-18

      - name: Check formatting
        run: git ls-files '*.hpp' '*.cpp' | xargs clang-format-18 --dry-run --Werror

  # strategies may include only domain, strategy api and portfolio headers; apps/strategyd is the boundary
  layering:
    name: include layering
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Strategies see domain + strategy API only
        run: |
          allowed='raikiri/(domain|strategy|strategies|common|portfolio)/'
          bad=$(grep -rnE '#[[:space:]]*include[[:space:]]*[<"]raikiri/' \
                  libs/strategy libs/strategies | grep -vE "$allowed" || true)
          if [ -n "$bad" ]; then
            echo "::error::strategy layer includes a header outside domain/strategy/common"
            echo "$bad"
            exit 1
          fi

          badlink=$(grep -nE 'raikiri::(venue_[A-Za-z0-9_]+|net|shm|exec|journal|oms|persist|simcore|config)' \
                      libs/strategy/CMakeLists.txt libs/strategies/CMakeLists.txt || true)
          if [ -n "$badlink" ]; then
            echo "::error::strategy layer links a venue or transport target"
            echo "$badlink"
            exit 1
          fi
          echo "layering ok"

  tidy:
    name: clang-tidy (changed files)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build clang-18 clang-tidy-18 libc++-18-dev libc++abi-18-dev

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Conan
        run: pip install --disable-pip-version-check 'conan~=2.31'

      # same key as build.yml's clang-18 rel entry, to share its cache
      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: conan2-${{ runner.os }}-linux-clang18-relwithdebinfo-${{ hashFiles('conanfile.py', 'profiles/linux-clang18') }}
          restore-keys: |
            conan2-${{ runner.os }}-linux-clang18-relwithdebinfo-

      # compile commands must come from clang
      - name: Install dependencies
        run: make deps PRESET=rel PROFILE=profiles/linux-clang18

      - name: Configure
        run: cmake --preset rel

      # the sbe codecs are generated at build time and tidy cannot parse without them
      - name: Generate SBE codecs
        run: cmake --build --preset rel --target raikiri_schema_gen

      - name: Collect changed files
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="origin/${{ github.base_ref }}...HEAD"
          else
            before="${{ github.event.before }}"
            if [ -z "$before" ] || ! git cat-file -e "${before}^{commit}" 2>/dev/null; then
              before=$(git rev-parse HEAD~1)
            fi
            range="${before}..HEAD"
          fi
          git diff --name-only --diff-filter=ACMR "$range" > changed.txt || true

          # a touched header pulls in its library's sources; header-only libs are not covered
          {
            grep -E '\.cpp$' changed.txt || true
            # grep exits 1 when nothing matches, which fails the pipeline under pipefail
            { grep -E '^libs/[^/]+/include/.*\.hpp$' changed.txt || true; } | \
              sed -E 's|^(libs/[^/]+)/include/.*|\1/src|' | sort -u | \
              while read -r dir; do ls "$dir"/*.cpp 2>/dev/null || true; done
          } | { grep -vE '^fuzz/' || true; } | sort -u > tidy-files.txt

          echo "count=$(wc -l < tidy-files.txt)" >> "$GITHUB_OUTPUT"
          cat tidy-files.txt

      - name: Run clang-tidy
        if: steps.changed.outputs.count != '0'
        run: |
          xargs -r -a tidy-files.txt \
            clang-tidy-18 -p build/rel --quiet --warnings-as-errors='*'
