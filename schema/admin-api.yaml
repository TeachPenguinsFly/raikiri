openapi: 3.1.0

# contract between admind and the terminal; frontend/src/api/types.ts is generated from it
# prices, sizes and money are decimal strings; ids and ns timestamps are digit strings

info:
  title: raikiri admin API
  version: 1.0.0
  license:
    name: LGPL-3.0-or-later
  description: |
    Reads over a running raikiri deployment: live state from each gateway's
    shared-memory segment and history from Postgres. Live data comes over the
    WebSocket at `/v1/stream`.

servers:
  - url: http://127.0.0.1:8787
    description: admind, bound to loopback while authentication is unresolved

tags:
  - name: system
  - name: catalogue
  - name: trading
  - name: analytics
  - name: live
  - name: options
  - name: cache
  - name: execution
  - name: audit
  - name: risk

paths:
  /v1/health:
    get:
      tags: [system]
      summary: What is running, and whether it is answering
      operationId: getHealth
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /v1/venues/metrics:
    get:
      tags: [system]
      summary: Each gateway's venue clock and feed health
      description: |
        One row per gateway, read from its segment. The clock is measured at start
        and then hourly, as the shortest of five round trips to the venue's own
        server-time method. A venue without one says `none` and its lag is only on
        the local clock. Feed figures cover the gateway's rolling minute.
      operationId: listVenueMetrics
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/VenueMetrics" }

  /v1/reference:
    get:
      tags: [system]
      summary: One reference mid per asset, as refd publishes it
      description: |
        Read from refd's `ref.mid` segment. Each asset's mid is the weighted
        median of the venues' spot mids in USD, with perps entering only through
        their measured basis to spot. A book is cut when it is empty, crossed,
        wider than the spread limit, stale, quoted in a currency without a rate,
        a second book of the same venue, a perp whose basis is still warming, or
        an outlier from the median. Fewer than the minimum sources refuses the
        row and leaves the mid out.
      operationId: listReferences
      parameters:
        - name: asset
          in: query
          required: false
          schema: { type: string }
          description: An asset key such as `crypto:BTC`, or the bare `BTC`.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReferenceList" }
        "503":
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
          description: No refd publishes on this host.

  /v1/accounts:
    get:
      tags: [system]
      summary: The (venue, market) pairs with a gateway attached
      description: |
        One account is one gatewayd process. The name is the segment name:
        `bybit` is the perpetual gateway, `bybit-spot` the spot one beside it.
      operationId: listAccounts
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Account" }

  /v1/markets:
    get:
      tags: [catalogue]
      summary: The catalogue grouped by market, not listed by venue
      description: |
        One row per canonical symbol with every venue that lists it, ordered by
        venue count, then name. Only spot and perpetuals carry a canonical symbol;
        dated futures and options keep the venue's own.
      operationId: listMarkets
      parameters:
        - name: q
          in: query
          description: Case-insensitive substring of the canonical symbol.
          schema: { type: string, examples: ["BTC"] }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Market" }

  /v1/instruments:
    get:
      tags: [catalogue]
      summary: The instrument catalogue of one or every attached gateway
      operationId: listInstruments
      parameters:
        - { $ref: "#/components/parameters/Account" }
        - name: kind
          in: query
          schema: { $ref: "#/components/schemas/MarketType" }
        - name: underlying
          in: query
          description: Options and dated futures only, e.g. `BTC`.
          schema: { type: string }
        - name: expiry
          in: query
          description: |
            Options and dated futures only. An exact expiry in nanoseconds, as
            `GET /v1/instruments` returns it in `expiry`.
          schema: { $ref: "#/components/schemas/Nanos" }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/Page" }
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/Instrument" }

  /v1/instruments/{instrument_id}:
    get:
      tags: [catalogue]
      operationId: getInstrument
      parameters:
        - { $ref: "#/components/parameters/InstrumentId" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Instrument" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/options/underlyings:
    get:
      tags: [options]
      summary: Underlyings with listed options, by venue and expiry
      operationId: listOptionUnderlyings
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/OptionUnderlying" }

  /v1/options/chain:
    get:
      tags: [options]
      summary: One expiry's chain across venues
      description: |
        Per strike, every venue's call and put with the best bid and ask across
        venues in USD. The forward is put-call parity over each venue's mids,
        else the venues' own underlying, else their index. A coin premium is
        shown in coin and in USD at the venue's index. Implied vols and greeks
        are the venue's where it publishes them, else Black-76 on this forward;
        `iv_source` and `greeks_source` say which. Live prices follow over
        `/v1/stream` `quotes` and `greeks` by `instrument_id`.
      operationId: getOptionChain
      parameters:
        - name: underlying
          in: query
          required: true
          schema: { type: string, examples: ["BTC"] }
        - name: expiry
          in: query
          required: true
          description: A UTC date, `YYYYMMDD`, or the expiry instant in nanoseconds.
          schema: { type: string, examples: ["20261127"] }
        - $ref: "#/components/parameters/OptionVenues"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OptionChain" }
        "400":
          description: A required parameter is missing or a venue is unknown
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/options/surface:
    get:
      tags: [options]
      summary: The volatility surface of one underlying
      description: |
        Per expiry the ATM vol, 25-delta risk reversal and butterfly, the SVI
        slice and the chosen model's smile across the quoted strikes, the venues'
        out-of-the-money mid vols and their residuals to the fit. Fitted at most
        every few seconds; a request inside that window gets the last fit.
      operationId: getOptionSurface
      parameters:
        - name: underlying
          in: query
          required: true
          schema: { type: string, examples: ["BTC"] }
        - $ref: "#/components/parameters/OptionVenues"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OptionSurface" }
        "400":
          description: The underlying is missing or a venue is unknown
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/options/risk:
    get:
      tags: [options]
      summary: Greeks, premium and P&L of the option positions
      description: |
        The positions the venues report, marked off the feed. Every figure is
        in one convention whichever way the contract settles: `units` are
        contracts × contract size in the underlying, signed, + long; greeks are
        Black-76 on the forward at the vol that reprices the mark. `delta_coin`
        is ∂V/∂F in underlying units, `delta_adjusted_coin` the same less a coin
        premium (Δ − C/F), `delta_usd` is `delta_coin` × F, `gamma` the change
        in `delta_coin` per one USD of F, `gamma_usd_1pct` the change in
        `delta_usd` per a 1% move in F, `vega_usd` per vol point and `theta_usd`
        per calendar day. USD means the quote currency.

        Unsuffixed money is in `premium_unit`, per position; a coin figure turns
        into USD at the venue's index today, so `value_usd` − `premium_usd` =
        `unrealized_usd`. `premium` is + paid, − received, off the venue's
        average entry. `realized` is what the fills booked, gross of fees, and
        null with no database; `realized_available` says which.

        A position past expiry never keeps a mark: it settles at the venue's
        price or else the first index read at or after expiry, books its P&L in
        `settled`, once, and leaves `positions`. With no price to settle at it
        waits in `awaiting_settlement`, out of every total. A figure with no
        input is null, never zero, and `incomplete` on a total counts the
        positions it understates.
      operationId: getOptionRisk
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OptionRisk" }

  /v1/options/risk/scenarios:
    get:
      tags: [options]
      summary: Spot by vol matrix of one underlying's option P&L
      description: |
        Each cell revalues every position in full with the pricing library at
        F × (1 + spot) and σ + vol across all expiries, with no time passing; a
        coin premium's USD value moves with the coin as well. The mark's gap to
        the model carries through, so the cell at no shock is the current value.
        `pnl_usd` is the cell's value less `base_value_usd`; the lowest is
        `worst`. A shocked vol floors at 1%. `excluded` lists positions with no
        mark, vol or forward to revalue from, which the matrix leaves out.
      operationId: getOptionRiskScenarios
      parameters:
        - name: underlying
          in: query
          required: true
          schema: { type: string, examples: ["BTC"] }
        - name: spot
          in: query
          description: Comma list of up to 21 percent moves above −100. Defaults to −30 to 30.
          schema: { type: string, examples: ["-20,-10,0,10,20"] }
        - name: vol
          in: query
          description: Comma list of up to 21 vol point moves. Defaults to −20 to 20.
          schema: { type: string, examples: ["-10,0,10"] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OptionRiskScenarios" }
        "400":
          description: The underlying is missing or a shock does not parse
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /v1/orders:
    get:
      tags: [trading]
      summary: Orders, newest first
      operationId: listOrders
      parameters:
        - { $ref: "#/components/parameters/Account" }
        - { $ref: "#/components/parameters/BookFilter" }
        - { $ref: "#/components/parameters/ParentFilter" }
        - name: instrument_id
          in: query
          schema: { $ref: "#/components/schemas/InstrumentId" }
        - name: open
          in: query
          description: Restrict to orders that can still fill.
          schema: { type: boolean }
        - { $ref: "#/components/parameters/Since" }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/Page" }
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/Order" }

    post:
      tags: [trading]
      summary: Place an order by hand
      operationId: placeOrder
      description: |
        The manual path into execution. 202 means the intent was written to the
        command ring, not that a venue accepted it; follow
        `GET /v1/orders/{client_order_id}/events` or the `orders` feed on
        `/v1/stream`. The `client_order_id` is minted here under the desk's reserved
        strategy id. Send `Idempotency-Key` to retry safely.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: |
            Any opaque string, stable across retries of the same intent. A repeat
            returns the original 202 and places nothing.
          schema: { type: string, minLength: 8, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewOrder" }
      responses:
        "202":
          description: Accepted by the desk and queued for the venue
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderAccepted" }
        "403":
          description: The body names a book this operator may not place in.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404":
          description: The body names a client book that has not been opened.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "422":
          description: |
            Refused by the desk before anything was queued: an unknown instrument, a
            price off the tick, a quantity off the lot, a market order with a price or a
            limit order without one. Risk checks run later in strategyd and arrive as
            order events.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "503":
          description: |
            No desk is attached. Worth retrying.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /v1/orders/{client_order_id}:
    get:
      tags: [trading]
      operationId: getOrder
      parameters:
        - { $ref: "#/components/parameters/ClientOrderId" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "404": { $ref: "#/components/responses/NotFound" }

    delete:
      tags: [trading]
      summary: Cancel a working order
      operationId: cancelOrder
      description: |
        The cancel is queued, not confirmed; the order can still fill meanwhile.
      parameters:
        - { $ref: "#/components/parameters/ClientOrderId" }
      responses:
        "202":
          description: Cancel queued for the venue
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderAccepted" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            The order is already filled, expired or canceled. Nothing was queued.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "503":
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
          description: No desk is attached.

  /v1/orders/{client_order_id}/events:
    get:
      tags: [trading]
      summary: Every lifecycle event this order went through, oldest first
      description: |
        The events behind the order row. When the two disagree the events are
        right.
      operationId: listOrderEvents
      parameters:
        - { $ref: "#/components/parameters/ClientOrderId" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/OrderEvent" }

  /v1/fills:
    get:
      tags: [trading]
      summary: Executions, deduplicated on what the venue calls unique
      operationId: listFills
      parameters:
        - { $ref: "#/components/parameters/Account" }
        - { $ref: "#/components/parameters/BookFilter" }
        - { $ref: "#/components/parameters/ParentFilter" }
        - name: instrument_id
          in: query
          schema: { $ref: "#/components/schemas/InstrumentId" }
        - { $ref: "#/components/parameters/Since" }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/Page" }
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/Fill" }

  /v1/balances:
    get:
      tags: [trading]
      summary: What each venue says the account holds
      description: |
        Live from the gateway segments; balances are not persisted. This is not
        equity and does not compute it. A venue that cannot report balances appears
        with an empty `assets` and no `reported_at`.
      operationId: listBalances
      parameters:
        - { $ref: "#/components/parameters/Account" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AccountBalances" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/positions:
    get:
      tags: [trading]
      summary: What is held, by book and instrument
      description: |
        A book's position nets every parent and hand order in it. With `parent`
        the rows are what that parent's own fills add up to.
      operationId: listPositions
      parameters:
        - { $ref: "#/components/parameters/Account" }
        - name: strategy_id
          in: query
          schema: { type: integer, minimum: 0, maximum: 65535 }
        - { $ref: "#/components/parameters/BookFilter" }
        - { $ref: "#/components/parameters/ParentFilter" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Position" }

  /v1/pnl:
    get:
      tags: [analytics]
      summary: The PnL ledger, as increments
      description: |
        Ledger increments, not a running total. Sum them over the window you
        need.
      operationId: listPnl
      parameters:
        - { $ref: "#/components/parameters/Account" }
        - { $ref: "#/components/parameters/BookFilter" }
        - { $ref: "#/components/parameters/ParentFilter" }
        - name: kind
          in: query
          schema: { $ref: "#/components/schemas/PnlKind" }
        - { $ref: "#/components/parameters/Since" }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/Page" }
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/PnlIncrement" }

  /v1/funding:
    get:
      tags: [analytics]
      summary: Funding rates as observed, not as charged
      description: |
        Rates the venues published, not funding charged.
      operationId: listFunding
      parameters:
        - name: instrument_id
          in: query
          schema: { $ref: "#/components/schemas/InstrumentId" }
        - { $ref: "#/components/parameters/Since" }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/Page" }
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/FundingObservation" }

  /cache/stats:
    get:
      tags: [cache]
      summary: What every gateway on this machine is subscribed to, right now
      description: |
        Debug view of the snapshot each gatewayd writes every 5 s to
        `$RAIKIRI_RUNTIME_DIR/stats/<account>.json`. A snapshot older than 30 s is
        listed with `stale: true`; a gateway whose process is gone is `down`.
      operationId: getCacheStats
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CacheStats" }

  /cache/stats/{account}:
    get:
      tags: [cache]
      summary: One gateway's snapshot
      operationId: getCacheGatewayStats
      parameters:
        - name: account
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CacheGateway" }
        "404":
          description: No snapshot for that account
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /cache/latency:
    get:
      tags: [cache]
      summary: Every gateway's clock offset and latency series
      description: |
        The `clock` and `latency` sections of the same snapshots /cache/stats
        reads. The same numbers in Prometheus text are at GET /metrics.
      operationId: getCacheLatency
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CacheLatencies" }

  /cache/latency/{account}:
    get:
      tags: [cache]
      summary: One gateway's clock offset and latency series
      operationId: getCacheGatewayLatency
      parameters:
        - name: account
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CacheLatency" }
        "404":
          description: No snapshot for that account
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /v1/x/{upstream}/{path}:
    get:
      tags: [system]
      summary: Forwarded to a service this API does not describe
      description: |
        With `--upstream <name>=<port>`, admind forwards `/v1/x/<name>/<path>` to
        that loopback service and returns its answer verbatim. The payload is not
        described here, apart from `UpstreamTable`. An unconfigured upstream is a 404;
        one that does not answer is a 503.
      operationId: getUpstream
      parameters:
        - name: upstream
          in: path
          required: true
          schema: { type: string }
        - name: path
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Whatever the upstream returned
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UpstreamTable" }
        "404":
          description: No upstream is configured under that name
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "503":
          description: The upstream did not answer
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /v1/books:
    get:
      tags: [trading]
      summary: Every book on record
      description: |
        A book is who an order belongs to: a strategy, `manual:<login>`, the shared
        `manual`, `client:<name>` or `hedge`. Its id is the strategy half of the
        client order id, and an id is never handed out twice.
      operationId: listBooks
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BookRecord" }
    post:
      tags: [trading]
      summary: Open a client's book
      description: |
        For the client edge. Opening one that exists answers it with a 200. The other
        kinds are made by their own paths: a strategy when it starts, `manual:<login>`
        on the operator's first order, `hedge` on first use.
      operationId: openBook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, examples: ["client:acme"] }
      responses:
        "200":
          description: Already open
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookRecord" }
        "201":
          description: Opened
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookRecord" }
        "422":
          description: Not a client's book name.

  /v1/joe/parents:
    get:
      tags: [execution]
      summary: Parent orders joe is working or has worked, newest first
      description: |
        joe runs inside strategyd (`--joe <strategy id>`) and admind forwards
        `/v1/joe/` to the upstream named `strategyd`. Parents live in memory and a
        restart forgets them; their children are ordinary orders in the journal, and
        `GET /v1/orders?parent=<id>` still answers for them.
      operationId: listParentOrders
      parameters:
        - name: client_tag
          in: query
          required: false
          schema: { type: string }
          description: Only the parent started with this tag.
        - name: book
          in: query
          required: false
          schema: { type: string }
          description: Only parents on this book, by name.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ParentOrder" }
        "503":
          description: joe is off, or strategyd is not answering
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

    post:
      tags: [execution]
      summary: Start a parent order
      description: |
        joe slices the parent in time (`twap`, `vwap`, `pov`) or sends it at once
        (`sor`), and routes each slice across the venues that list the symbol and
        take orders, by price after the taker fee; those children are IOC limits.
        `iceberg` and `pegged` instead rest one GTC or post-only child at a time on
        one venue. Every child passes strategyd's risk gate under joe's strategy id.
        A `client_tag` joe still holds answers 200 with the first parent instead of
        starting another.
      operationId: startParentOrder
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewParentOrder" }
      responses:
        "200":
          description: A parent with this client_tag exists already
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id: { $ref: "#/components/schemas/ParentId" }
        "201":
          description: Started
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id: { $ref: "#/components/schemas/ParentId" }
        "400":
          description: The body is not a parent order
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "422":
          description: The parent cannot run as given
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "503":
          description: joe is off, or strategyd is not answering
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /v1/joe/parents/{id}:
    get:
      tags: [execution]
      summary: One parent order with its child orders
      operationId: getParentOrder
      parameters:
        - { $ref: "#/components/parameters/ParentId" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ParentOrder" }
        "404":
          description: No such parent order
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "503":
          description: joe is off, or strategyd is not answering
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /v1/joe/parents/{id}/trace:
    get:
      tags: [execution]
      summary: What a parent saw while it worked, for the in-flight chart
      description: |
        Mids sampled across venues and every fill, each with a `seq` shared by both lists. Pass
        the answer's `seq` back as `since` to get only what is newer; the plan comes only with
        a full read. Buffers are bounded: a full one drops its oldest entry and counts it in
        `mids_dropped` / `fills_dropped`.
      operationId: getParentTrace
      parameters:
        - { $ref: "#/components/parameters/ParentId" }
        - name: since
          in: query
          required: false
          schema: { type: string, pattern: '^\d+$' }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ParentTrace" }
        "400":
          description: since is not a seq
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404":
          description: No such parent order
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "503":
          description: joe is off, or strategyd is not answering
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /v1/risk:
    get:
      tags: [risk]
      summary: Desk capital, the defaults row and every book's limits, state and p&l
      description: |
        Forwarded to strategyd's control port, so `--upstream strategyd=<port>` must be set. With no
        capital declared, every new order is refused and cancels pass. A limit is set as a percent of
        capital or in dollars and comes back both ways.
      operationId: getBookRisk
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookRiskDesk" }
        "503":
          description: strategyd is not answering, or admind has no such upstream
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /v1/risk/capital:
    post:
      tags: [risk]
      summary: Declare the desk's capital
      description: A raise, and so the first figure, needs `confirm`. Applies at once. Written to the audit trail.
      operationId: setBookRiskCapital
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BookRiskCapitalChange" }
      responses:
        "200": { $ref: "#/components/responses/BookRiskDesk" }
        "400": { $ref: "#/components/responses/BookRiskProblem" }
        "409": { $ref: "#/components/responses/BookRiskNeedsConfirm" }
        "422": { $ref: "#/components/responses/BookRiskProblem" }
        "503": { $ref: "#/components/responses/BookRiskProblem" }

  /v1/risk/defaults:
    post:
      tags: [risk]
      summary: Change the row every book inherits from
      operationId: setBookRiskDefaults
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BookRiskLimitsChange" }
      responses:
        "200": { $ref: "#/components/responses/BookRiskDesk" }
        "400": { $ref: "#/components/responses/BookRiskProblem" }
        "409": { $ref: "#/components/responses/BookRiskNeedsConfirm" }
        "422": { $ref: "#/components/responses/BookRiskProblem" }
        "503": { $ref: "#/components/responses/BookRiskProblem" }

  /v1/risk/kill:
    post:
      tags: [risk]
      summary: Halt every book and cancel every open order
      description: Positions stay as they are. The halt survives a restart and only a person resumes.
      operationId: killAllBooks
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BookRiskChange" }
      responses:
        "200": { $ref: "#/components/responses/BookRiskKilled" }
        "422": { $ref: "#/components/responses/BookRiskProblem" }
        "503": { $ref: "#/components/responses/BookRiskProblem" }

  /v1/risk/resume:
    post:
      tags: [risk]
      summary: Lift the halt over everything
      description: A book halted on its own stays halted.
      operationId: resumeAllBooks
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BookRiskChange" }
      responses:
        "200": { $ref: "#/components/responses/BookRiskDesk" }
        "409": { $ref: "#/components/responses/BookRiskNeedsConfirm" }
        "422": { $ref: "#/components/responses/BookRiskProblem" }
        "503": { $ref: "#/components/responses/BookRiskProblem" }

  /v1/risk/internal:
    get:
      tags: [risk]
      summary: Internal crossing, its switches, volume and what the desk carries
      operationId: getInternalCross
      responses:
        "200": { $ref: "#/components/responses/InternalCrossDesk" }
    post:
      tags: [risk]
      summary: Set the crossing switches
      description: Off by default. Turning it on or widening it needs `confirm`, and every change is audited.
      operationId: setInternalCross
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InternalCrossGlobalChange" }
      responses:
        "200": { $ref: "#/components/responses/InternalCrossDesk" }
        "409": { $ref: "#/components/responses/BookRiskNeedsConfirm" }
        "422": { $ref: "#/components/responses/BookRiskProblem" }
        "503": { $ref: "#/components/responses/BookRiskProblem" }

  /v1/risk/internal/books/{name}:
    post:
      tags: [risk]
      summary: Set one client book's crossing, fee and allowed instruments
      operationId: setInternalCrossBook
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InternalCrossBookChange" }
      responses:
        "200": { $ref: "#/components/responses/InternalCrossDesk" }
        "409": { $ref: "#/components/responses/BookRiskNeedsConfirm" }
        "422": { $ref: "#/components/responses/BookRiskProblem" }
        "503": { $ref: "#/components/responses/BookRiskProblem" }

  /v1/risk/books/{id}:
    get:
      tags: [risk]
      summary: One book, by id or name
      description: A hedger reads `row.limits.order_notional.effective` here to size its children.
      operationId: getBookRiskBook
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookRiskBook" }
        "404": { $ref: "#/components/responses/BookRiskProblem" }
        "503": { $ref: "#/components/responses/BookRiskProblem" }

  /v1/risk/books/{id}/limits:
    post:
      tags: [risk]
      summary: Change a book's own limits
      operationId: setBookRiskLimits
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BookRiskLimitsChange" }
      responses:
        "200": { $ref: "#/components/responses/BookRiskDesk" }
        "400": { $ref: "#/components/responses/BookRiskProblem" }
        "409": { $ref: "#/components/responses/BookRiskNeedsConfirm" }
        "422": { $ref: "#/components/responses/BookRiskProblem" }
        "503": { $ref: "#/components/responses/BookRiskProblem" }

  /v1/risk/books/{id}/state:
    post:
      tags: [risk]
      summary: Move a book to reducing, or resume it
      description: |
        `reducing` lets only orders that shrink the position out. Moving towards `active` needs
        `confirm`. A halt goes through the kill route, which pulls the orders.
      operationId: setBookRiskState
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BookRiskStateChange" }
      responses:
        "200": { $ref: "#/components/responses/BookRiskDesk" }
        "409": { $ref: "#/components/responses/BookRiskNeedsConfirm" }
        "422": { $ref: "#/components/responses/BookRiskProblem" }
        "503": { $ref: "#/components/responses/BookRiskProblem" }

  /v1/risk/books/{id}/kill:
    post:
      tags: [risk]
      summary: Halt one book and cancel its open orders
      description: The position stays as it is. The halt survives a restart and only a person resumes.
      operationId: killBook
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BookRiskChange" }
      responses:
        "200": { $ref: "#/components/responses/BookRiskKilled" }
        "422": { $ref: "#/components/responses/BookRiskProblem" }
        "503": { $ref: "#/components/responses/BookRiskProblem" }

  /v1/audit:
    get:
      tags: [audit]
      summary: Who did what and why it was allowed or refused, newest first
      description: |
        Merged across every process that writes an audit stream. `actor`, `action` and `subject`
        match exactly, or as a prefix when they end in `*`. Lines that cannot be read are left out
        here; `/v1/audit/status` reports them.
      operationId: listAudit
      parameters:
        - { $ref: "#/components/parameters/Since" }
        - name: until
          in: query
          description: Upper bound on `ts`, exclusive.
          schema: { $ref: "#/components/schemas/Nanos" }
        - { name: actor, in: query, schema: { type: string, examples: ["operator", "strategy:*"] } }
        - { name: action, in: query, schema: { type: string, examples: ["order.refused", "joe.*"] } }
        - { name: subject, in: query, schema: { type: string, examples: ["strategy:7"] } }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditPage" }
        "400":
          description: A bound, limit or cursor could not be read
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /v1/audit/status:
    get:
      tags: [audit]
      summary: Whether each audit stream's hash chain holds
      description: |
        Verifies each stream's newest day, or the named day, on every request. The hash is unkeyed:
        this catches edits, deletions and reordering, and a full rewrite of a chain only shows
        against a `head_sha256` copied somewhere else.
      operationId: getAuditStatus
      parameters:
        - name: day
          in: query
          description: A UTC day; each stream's newest when absent.
          schema: { type: string, examples: ["2026-11-02"] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditStatus" }
        "400":
          description: The day could not be read
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /v1/joe/tca:
    get:
      tags: [execution]
      summary: Child orders of every parent joe still holds, summed per venue
      operationId: getJoeTca
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JoeTca" }
        "503":
          description: joe is off, or strategyd is not answering
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /v1/joe/parents/{id}/cancel:
    post:
      tags: [execution]
      summary: Cancel a parent order and its working children
      operationId: cancelParentOrder
      parameters:
        - { $ref: "#/components/parameters/ParentId" }
      responses:
        "200":
          description: The parent after the change
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ParentOrder" }
        "404":
          description: No such parent order
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "409":
          description: The parent is not in a state for that
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "503":
          description: joe is off, or strategyd is not answering
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /v1/joe/parents/{id}/pause:
    post:
      tags: [execution]
      summary: Pause a parent order and cancel its working children
      operationId: pauseParentOrder
      parameters:
        - { $ref: "#/components/parameters/ParentId" }
      responses:
        "200":
          description: The parent after the change
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ParentOrder" }
        "404":
          description: No such parent order
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "409":
          description: The parent is not in a state for that
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "503":
          description: joe is off, or strategyd is not answering
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /v1/joe/parents/{id}/resume:
    post:
      tags: [execution]
      summary: Resume a paused parent order
      operationId: resumeParentOrder
      parameters:
        - { $ref: "#/components/parameters/ParentId" }
      responses:
        "200":
          description: The parent after the change
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ParentOrder" }
        "404":
          description: No such parent order
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "409":
          description: The parent is not in a state for that
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "503":
          description: joe is off, or strategyd is not answering
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /v1/recon-breaks:
    get:
      tags: [analytics]
      summary: Where the book and a venue disagreed
      operationId: listReconBreaks
      parameters:
        - { $ref: "#/components/parameters/Account" }
        - { $ref: "#/components/parameters/Since" }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/Page" }
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/ReconBreak" }

  /v1/stream/token:
    get:
      tags: [live]
      summary: A short-lived token for the stream upgrade
      description: |
        Browsers send no basic auth on a WebSocket upgrade, so the stream takes this
        token instead. It lives for 60 seconds and is checked only at the upgrade.
      operationId: issueStreamToken
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StreamToken" }

  /v1/stream:
    get:
      tags: [live]
      summary: Everything live, over one WebSocket
      description: |
        A WebSocket upgrade, refused with 401 unless `token` is one that
        `GET /v1/stream/token` issued and has not expired. Every message shape is a
        schema below.

        ## State and events

        State (quotes, books, greeks, funding, positions, health) is sampled from
        the seqlock tables at a fixed cadence and only the current value is sent,
        so a slow client gets fewer frames, not lag. Events (order events, fills,
        reconciliation breaks) are sequenced and never coalesced; each carries a
        `seq`, and a `gap` frame reports a ring overrun.

        ## Client messages

            {"op":"subscribe","id":"q1","quotes":["<instrument_id>", ...]}
            {"op":"subscribe","id":"b1","book":"<instrument_id>"}
            {"op":"subscribe","id":"g1","greeks":["<instrument_id>", ...]}
            {"op":"subscribe","id":"a1","events":["orders","fills","recon"]}
            {"op":"unsubscribe","id":"q1"}

        `id` is the client's handle and comes back on the ack and every frame.

        ## Server messages

        Each is a `StreamFrame`; `type` selects the variant.

            {"type":"ack","id":"q1"}
            {"type":"quotes","id":"q1","ts":"...","quotes":[Quote, ...]}
            {"type":"book","id":"b1","ts":"...","book":Book}
            {"type":"greeks","id":"g1","ts":"...","greeks":[Greeks, ...]}
            {"type":"event","id":"a1","seq":"1042","event":OrderEvent}
            {"type":"gap","id":"a1","missed":"17"}
            {"type":"problem","id":"q1","problem":Problem}

        ## Cadence

        Default 10 Hz per state subscription. `hz` on the subscribe asks for
        another rate; the ack states what the server will do, capped at its own
        sampling rate.
      operationId: openStream
      parameters:
        - name: token
          in: query
          required: true
          schema: { type: string }
      responses:
        "101":
          description: Switching protocols
        "401":
          description: The token is missing, malformed, forged or expired

components:
  parameters:
    Account:
      name: account
      in: query
      description: An account name, as `GET /v1/accounts` returns it.
      schema: { type: string, examples: ["bybit-spot"] }
    InstrumentId:
      name: instrument_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/InstrumentId" }
    BookFilter:
      name: book
      in: query
      description: A book's id or its name.
      schema: { type: string, examples: ["manual:vova", "1024"] }
    ParentFilter:
      name: parent
      in: query
      description: Only what this joe parent did.
      schema: { $ref: "#/components/schemas/ParentId" }
    ParentId:
      name: id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/ParentId" }
    ClientOrderId:
      name: client_order_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/ClientOrderId" }
    Since:
      name: since
      in: query
      description: Lower bound on `ts_event`, inclusive.
      schema: { $ref: "#/components/schemas/Nanos" }
    Cursor:
      name: cursor
      in: query
      description: |
        Opaque; take it from the previous page's `next_cursor`.
      schema: { type: string }
    OptionVenues:
      name: venue
      in: query
      description: Comma-separated venue names; every venue when absent.
      schema: { type: string, examples: ["deribit,okx"] }

    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 1000, default: 200 }

  responses:
    InternalCrossDesk:
      description: Crossing as it stands
      content:
        application/json:
          schema: { $ref: "#/components/schemas/InternalCrossDesk" }
    BookRiskDesk:
      description: The desk after the change
      content:
        application/json:
          schema: { $ref: "#/components/schemas/BookRiskDesk" }
    BookRiskKilled:
      description: Halted, and the cancels sent
      content:
        application/json:
          schema: { $ref: "#/components/schemas/BookRiskKilled" }
    BookRiskProblem:
      description: Refused, or strategyd is not answering; nothing changed unless the detail says so
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    BookRiskNeedsConfirm:
      description: This lets more through and `confirm` was not sent
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/BookRiskNeedsConfirm" }
    NotFound:
      description: No such thing
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:

    Decimal:
      type: string
      description: |
        An exact decimal, as a string.
      pattern: '^-?\d+(\.\d+)?$'
      examples: ["79418.30", "-0.008", "0"]

    Nanos:
      type: string
      description: |
        Nanoseconds since the Unix epoch, as a string; the value exceeds 2^53.
      pattern: '^\d+$'
      examples: ["1787840965107000000"]

    InstrumentId:
      type: string
      description: |
        The packed instrument word, `{venue|market|reserved|symbol}`, as decimal
        digits; a string because it exceeds 2^53.
      pattern: '^\d+$'

    ClientOrderId:
      type: string
      description: Packed `{strategy_id|seq}`, as decimal digits.
      pattern: '^\d+$'

    MarketType:
      type: string
      enum: [spot, perp, future, option]

    Side:
      type: string
      enum: [buy, sell]

    BookRiskState:
      type: string
      enum: [active, reducing, halted]

    BookRiskLimitMode:
      type: string
      enum: [inherit, "off", absolute, percent]

    BookRiskLossAction:
      type: string
      enum: ["off", reducing, halted]

    BookRiskLimitSet:
      type: object
      required: [mode]
      properties:
        mode: { $ref: "#/components/schemas/BookRiskLimitMode" }
        value:
          $ref: "#/components/schemas/Decimal"
          description: Dollars or a whole count for absolute, percent of capital for percent.

    BookRiskLimit:
      type: object
      required: [set, source, mode]
      properties:
        set: { $ref: "#/components/schemas/BookRiskLimitSet" }
        source:
          type: string
          enum: [file, defaults, book]
          description: The row that decided.
        mode: { $ref: "#/components/schemas/BookRiskLimitMode" }
        effective:
          $ref: "#/components/schemas/Decimal"
          description: Dollars or the count; absent is off, or a percent with no capital to take it of.
        percent:
          $ref: "#/components/schemas/Decimal"
          description: The same limit as a percent of capital; money limits only.

    BookRiskRow:
      type: object
      required: [limits, daily_loss_action, daily_loss_action_set]
      properties:
        limits:
          type: object
          description: |
            order_notional, instrument_notional, book_notional, option_premium, loss_1m, loss_5m, loss_1h,
            daily_loss, option_open_lots, open_orders, price_band_bp, orders_in_window, order_window_ms,
            repeat_entries, repeat_window_ms, quote_age_ms.
          additionalProperties: { $ref: "#/components/schemas/BookRiskLimit" }
        daily_loss_action: { $ref: "#/components/schemas/BookRiskLossAction" }
        daily_loss_action_set: { type: boolean }

    BookRiskWindow:
      type: object
      required: [change, covered_s, past_level]
      properties:
        change: { $ref: "#/components/schemas/Decimal" }
        covered_s:
          type: integer
          description: How far back the samples reached, short of the window after a start.
        past_level: { type: boolean }

    BookRiskPnl:
      type: object
      description: Realised less fees plus unrealised, in dollars. It informs and takes no action.
      required:
        [realized, unrealized, total, change_1m, change_5m, change_1h, day, past_daily, positions, unmarked, unvalued]
      properties:
        realized: { $ref: "#/components/schemas/Decimal" }
        unrealized: { $ref: "#/components/schemas/Decimal" }
        total: { $ref: "#/components/schemas/Decimal" }
        change_1m: { $ref: "#/components/schemas/BookRiskWindow" }
        change_5m: { $ref: "#/components/schemas/BookRiskWindow" }
        change_1h: { $ref: "#/components/schemas/BookRiskWindow" }
        day: { $ref: "#/components/schemas/Decimal" }
        past_daily: { type: boolean }
        positions: { type: integer }
        unmarked:
          type: integer
          description: Positions with no quote. While any is unmarked the book takes no new sample.
        unvalued:
          type: integer
          description: Positions not quoted in a dollar, left out of the sums.

    BookRiskBook:
      type: object
      required: [id, name, state, own_state, open_orders, row, pnl]
      properties:
        id: { type: integer }
        name: { type: string }
        state:
          $ref: "#/components/schemas/BookRiskState"
          description: The stricter of the book's own state and the desk's.
        own_state: { $ref: "#/components/schemas/BookRiskState" }
        reason: { type: string }
        by: { type: string, description: "Who set the state: a person, or strategyd when a check tripped." }
        since: { type: string, description: "Nanoseconds as digits." }
        open_orders: { type: integer }
        row: { $ref: "#/components/schemas/BookRiskRow" }
        pnl: { $ref: "#/components/schemas/BookRiskPnl" }

    InternalCrossBook:
      type: object
      required: [book, enabled, fee_bp, instruments]
      properties:
        book: { type: string }
        enabled: { type: boolean }
        fee_bp: { type: integer, format: int64 }
        instruments: { type: array, items: { type: string }, description: "<local symbol>:<market>, as BTC/USDT:perp" }

    InternalCrossStats:
      type: object
      required: [crosses, against_clients, against_desk, notional, venue_cost_saved, fees, refused]
      properties:
        crosses: { type: integer, format: int64 }
        against_clients: { type: integer, format: int64 }
        against_desk: { type: integer, format: int64 }
        notional: { $ref: "#/components/schemas/Decimal" }
        venue_cost_saved: { $ref: "#/components/schemas/Decimal", description: "Estimate: half the spread and the taker fee, on both legs" }
        fees: { $ref: "#/components/schemas/Decimal" }
        refused: { type: object, additionalProperties: { type: integer, format: int64 } }

    InternalCrossVolume:
      type: object
      required: [book_id, book, notional]
      properties:
        book_id: { type: integer }
        book: { type: string }
        notional: { $ref: "#/components/schemas/Decimal" }

    InternalCrossLiability:
      type: object
      required: [instrument_id, symbol, client_long_lots, client_short_lots, hedge_lots, other_lots, book_sum_lots, offset_lots]
      properties:
        instrument_id: { type: string }
        symbol: { type: string }
        client_long_lots: { type: string }
        client_short_lots: { type: string }
        hedge_lots: { type: string }
        other_lots: { type: string }
        book_sum_lots: { type: string, description: What reconciliation compares with the venue }
        offset_lots: { type: string, description: Client lots backed only by another client's opposite position on this desk }
        venue_lots: { type: string, description: The venue's own figure, absent until it has answered }

    InternalCrossDesk:
      type: object
      required: [enabled, against_desk, max_spread_bp, max_quote_age_ms, hold_ms, books, stats, volume_by_book, liability]
      properties:
        enabled: { type: boolean }
        against_desk: { type: boolean, description: "Clients may also trade against the hedge book, only shrinking it" }
        max_spread_bp: { type: integer, format: int64 }
        max_quote_age_ms: { type: integer, format: int64 }
        hold_ms: { type: integer, format: int64 }
        books: { type: array, items: { $ref: "#/components/schemas/InternalCrossBook" } }
        stats: { $ref: "#/components/schemas/InternalCrossStats" }
        volume_by_book: { type: array, items: { $ref: "#/components/schemas/InternalCrossVolume" } }
        liability: { type: array, items: { $ref: "#/components/schemas/InternalCrossLiability" } }

    InternalCrossGlobalChange:
      type: object
      required: [by]
      properties:
        enabled: { type: boolean }
        against_desk: { type: boolean }
        max_spread_bp: { type: integer, format: int64 }
        max_quote_age_ms: { type: integer, format: int64 }
        hold_ms: { type: integer, format: int64 }
        by: { type: string }
        reason: { type: string }
        confirm: { type: boolean }

    InternalCrossBookChange:
      type: object
      required: [enabled, by]
      properties:
        enabled: { type: boolean }
        fee_bp: { type: integer, format: int64 }
        instruments: { type: array, items: { type: string } }
        by: { type: string }
        reason: { type: string }
        confirm: { type: boolean }

    BookRiskDesk:
      type: object
      required: [reported_accounts, unvalued_assets, desk_state, defaults, books]
      properties:
        capital:
          $ref: "#/components/schemas/Decimal"
          description: Absent until a person declares it, and no new order passes until then.
        capital_by: { type: string }
        capital_at: { type: string, description: "Nanoseconds as digits." }
        reported_balance:
          $ref: "#/components/schemas/Decimal"
          description: What the gateways' balance pulls come to in dollars; absent when none has reported.
        reported_accounts: { type: integer }
        unvalued_assets:
          type: integer
          description: Assets reported with no dollar price here, which `reported_balance` leaves out.
        capital_warning:
          type: string
          description: Set when the declared capital is above what balances report. It refuses nothing.
        desk_state: { $ref: "#/components/schemas/BookRiskState" }
        desk_reason: { type: string }
        desk_by: { type: string }
        desk_since: { type: string, description: "Nanoseconds as digits." }
        defaults: { $ref: "#/components/schemas/BookRiskRow" }
        books:
          type: array
          items: { $ref: "#/components/schemas/BookRiskBook" }

    BookRiskChange:
      type: object
      required: [by]
      properties:
        by: { type: string, description: "The person making the change; it goes to the audit trail." }
        reason: { type: string }
        confirm:
          type: boolean
          description: Says the person saw that this lets more through.

    BookRiskCapitalChange:
      allOf:
        - $ref: "#/components/schemas/BookRiskChange"
        - type: object
          required: [capital]
          properties:
            capital: { $ref: "#/components/schemas/Decimal" }

    BookRiskLimitsChange:
      allOf:
        - $ref: "#/components/schemas/BookRiskChange"
        - type: object
          properties:
            limits:
              type: object
              additionalProperties: { $ref: "#/components/schemas/BookRiskLimitSet" }
            daily_loss_action: { $ref: "#/components/schemas/BookRiskLossAction" }

    BookRiskStateChange:
      allOf:
        - $ref: "#/components/schemas/BookRiskChange"
        - type: object
          required: [state]
          properties:
            state: { $ref: "#/components/schemas/BookRiskState" }

    BookRiskKilled:
      type: object
      required: [cancelled]
      properties:
        cancelled: { type: integer, description: "Cancels sent for the open orders." }

    BookRiskNeedsConfirm:
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [raises]
          properties:
            raises:
              type: array
              items: { type: string }
              description: What this change would let more through, by name.

    Problem:
      description: RFC 9457. One error shape everywhere.
      type: object
      required: [title, status]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }

    Page:
      type: object
      properties:
        next_cursor:
          type: [string, "null"]
          description: Absent or null on the last page.

    AuditEntry:
      type: object
      required: [stream, day, seq, ts, actor, action, subject, detail, prev_sha256, sha256]
      properties:
        stream: { type: string, description: The process's chain this line belongs to. }
        day: { type: string, description: The UTC day of the file holding it. }
        seq: { type: string, pattern: '^\d+$', description: Position in the stream's chain. }
        ts: { $ref: "#/components/schemas/Nanos" }
        actor: { type: string, examples: ["operator", "strategy:7", "desk"] }
        action: { type: string, examples: ["strategy.start", "order.refused"] }
        subject: { type: string, examples: ["strategy:7", "order:123"] }
        detail:
          type: object
          additionalProperties: true
          description: |
            Free form per action. Commands carry `status`, `outcome` (`allowed`, `refused`, or
            `failed` when the handler threw), `request` and `answer`; refused orders carry `why`,
            and `limit` and `value` in the risk gate's raw units.
        prev_sha256: { type: string, description: SHA-256 of the line before this one, hex. }
        sha256: { type: string, description: SHA-256 of this line, hex. }

    AuditPage:
      allOf:
        - { $ref: "#/components/schemas/Page" }
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/AuditEntry" }

    AuditBreak:
      type: object
      required: [kind, line, expected_seq, found_seq]
      properties:
        kind:
          type: string
          enum: [malformed, sequence, prev_hash, anchor, head]
          description: |
            `malformed` a line cannot be read; `sequence` a line is missing or out of place;
            `prev_hash` the line before was edited; `anchor` the day does not follow the day
            before it; `head` the last lines are gone, or the last line was edited.
        line: { type: string, pattern: '^\d+$', description: 1-based line in the day's file. }
        expected_seq: { type: string, pattern: '^\d+$' }
        found_seq: { type: string, pattern: '^\d+$' }

    AuditStream:
      type: object
      required: [stream, state, days, lines, first_seq, last_seq, anchored, head_checked, torn_tail_bytes, recoveries,
                 overflows]
      properties:
        stream: { type: string }
        state:
          type: string
          enum: [intact, recovered, broken, empty]
          description: |
            `recovered` holds, but its writer recorded a torn tail or dropped entries that day.
        day: { type: string, description: The day checked; absent when the stream lacks it. }
        days: { type: integer, description: Day files the stream holds. }
        lines: { type: string, pattern: '^\d+$' }
        first_seq: { type: string, pattern: '^\d+$' }
        last_seq: { type: string, pattern: '^\d+$' }
        head_sha256: { type: string, description: SHA-256 of the last line checked; copy it elsewhere to anchor the chain. }
        anchored:
          type: boolean
          description: The first line follows the day before, or starts the chain. False once older days are gone.
        head_checked: { type: boolean, description: The last lines were compared with the writer's HEAD file. }
        torn_tail_bytes: { type: integer, description: Partial last line; the next writer to open truncates it. }
        recoveries: { type: integer, description: Recovery entries in the day. }
        overflows: { type: integer, description: Entries recording that the queue dropped lines. }
        first_break: { $ref: "#/components/schemas/AuditBreak" }

    AuditStatus:
      type: object
      required: [as_of, ok, streams]
      properties:
        as_of: { $ref: "#/components/schemas/Nanos" }
        ok: { type: boolean, description: False when any stream is broken. }
        streams:
          type: array
          items: { $ref: "#/components/schemas/AuditStream" }

    CacheStats:
      type: object
      required: [taken_ns, gateways, rollup]
      properties:
        taken_ns: { $ref: "#/components/schemas/Nanos" }
        gateways:
          type: array
          items: { $ref: "#/components/schemas/CacheGateway" }
        rollup:
          type: object
          required: [venues, total]
          properties:
            venues:
              type: array
              items: { $ref: "#/components/schemas/CacheRollup" }
            total: { $ref: "#/components/schemas/CacheRollup" }

    CacheRollup:
      description: Sums over gateways that are not down. `venue` is `all` in the total.
      type: object
      required: [venue, gateways, down, instruments, subscriptions, sockets, messages_per_second]
      properties:
        venue: { type: string }
        gateways: { type: integer }
        down: { type: integer }
        instruments: { type: integer }
        subscriptions: { type: integer, description: Accepted subscriptions, every channel. }
        sockets: { type: integer, description: Open sockets. }
        messages_per_second: { type: number }

    CacheGateway:
      type: object
      required: [account, state, stale, age_ms, snapshot]
      properties:
        account: { type: string }
        state: { type: string, enum: [up, stale, down] }
        stale: { type: boolean }
        age_ms: { type: integer }
        snapshot: { $ref: "#/components/schemas/GatewaySnapshot" }

    CacheTally:
      type: object
      required: [name, count]
      properties:
        name: { type: string }
        count: { type: integer }

    GatewaySnapshot:
      description: Version 1 of the file a gatewayd writes; readable with `cat`.
      type: object
      required: [version, taken_ns, account, venue, market, feed, channels, process,
                 catalogue, subscriptions, sockets, limits, coverage, rates]
      properties:
        version: { type: integer }
        taken_ns: { $ref: "#/components/schemas/Nanos" }
        account: { type: string }
        venue: { type: string }
        market: { type: string }
        feed: { type: string, description: The adapter's feed, e.g. kucoin `uta`. Empty for the default. }
        channels: { type: array, items: { type: string } }
        process:
          type: object
          required: [pid, generation, started_ns, uptime_s, build]
          properties:
            pid: { type: integer }
            generation: { $ref: "#/components/schemas/Nanos" }
            started_ns: { $ref: "#/components/schemas/Nanos" }
            uptime_s: { type: integer }
            build: { type: string }
        catalogue:
          type: object
          required: [instruments, by_market, by_asset_class, by_kind]
          properties:
            instruments: { type: integer }
            by_market: { type: array, items: { $ref: "#/components/schemas/CacheTally" } }
            by_asset_class: { type: array, items: { $ref: "#/components/schemas/CacheTally" } }
            by_kind: { type: array, items: { $ref: "#/components/schemas/CacheTally" } }
        subscriptions:
          type: array
          items:
            type: object
            required: [channel, requested, accepted, refused, messages, per_second]
            properties:
              channel: { type: string, enum: [bbo, trades, depth, funding, ticker, greeks] }
              requested: { type: integer }
              accepted: { type: integer, description: Taken by the adapter. }
              refused: { type: integer, description: Refused by the adapter. }
              messages: { type: integer }
              per_second: { type: number, description: Over the last 60 s. }
        sockets:
          description: One row per WebSocket pool carrying at least one key.
          type: array
          items:
            type: object
            required: [host, sockets, open, keys, min_keys, avg_keys, max_keys, pending_frames,
                       reopens, last_close_reason, last_close_ns, backoffs, refusals, backoff_ms]
            properties:
              host: { type: string }
              sockets: { type: integer }
              open: { type: integer }
              keys: { type: integer, description: Venue topics placed on the pool's sockets. }
              min_keys: { type: integer }
              avg_keys: { type: number }
              max_keys: { type: integer }
              pending_frames: { type: integer, description: Subscribe frames not yet sent. }
              reopens: { type: integer, description: Since start, first opens excluded. }
              last_close_reason: { type: string }
              last_close_ns: { $ref: "#/components/schemas/Nanos" }
              backoffs: { type: integer, description: Reconnect backoffs engaged on the host since start. }
              refusals: { type: integer, description: Handshakes the host refused with 429 or 418. }
              backoff_ms: { type: integer, description: Left on the host's current backoff; zero when none. }
        limits:
          description: The venue's ws_* rows from venues.yaml; zero is unconfigured.
          type: object
          required: [configured, ws_streams, ws_sockets, ws_channels, ws_subscriptions_per_frame,
                     ws_socket_messages, ws_socket_window_ms, ws_connects, ws_connects_window_ms]
          properties:
            configured: { type: boolean }
            ws_streams: { type: integer }
            ws_sockets: { type: integer }
            ws_channels: { type: integer }
            ws_subscriptions_per_frame: { type: integer }
            ws_socket_messages: { type: integer }
            ws_socket_window_ms: { type: integer }
            ws_connects: { type: integer }
            ws_connects_window_ms: { type: integer }
        coverage:
          type: object
          required: [subscribed, priced_60s, priced_ever, books_seeded, books_unseeded,
                     funding_received]
          properties:
            subscribed: { type: integer }
            priced_60s: { type: integer }
            priced_ever: { type: integer }
            books_seeded: { type: integer }
            books_unseeded: { type: integer }
            funding_received: { type: integer }
        rates:
          type: object
          required: [messages_per_second, window_s, venue_refusals, broken_frames, budget_denials, rest_limits,
                     rest_endpoints]
          properties:
            messages_per_second: { type: number }
            window_s: { type: integer }
            venue_refusals: { type: integer, description: Subscriptions the venue refused, where the adapter counts them. }
            broken_frames: { type: integer, description: Malformed frames dropped since start. }
            budget_denials: { type: integer }
            rest_limits:
              type: array
              items:
                type: object
                required: [name, max, window_ms, calls, denied]
                properties:
                  name: { type: string }
                  max: { type: integer }
                  window_ms: { type: integer }
                  calls: { type: integer }
                  denied: { type: integer }
            rest_endpoints:
              type: array
              items:
                type: object
                required: [endpoint, calls, refused, last_status]
                properties:
                  endpoint: { type: string }
                  calls: { type: integer }
                  refused: { type: integer }
                  last_status: { type: integer }
        clock: { $ref: "#/components/schemas/VenueClock" }
        latency:
          type: array
          items: { $ref: "#/components/schemas/LatencySeries" }

    VenueClock:
      description: |
        The venue's clock minus ours; a venue stamp converts as
        `ts_event - offset_ns`. `rest_probe` is the shortest of five round trips to
        the venue's server-time method, taken at start and then hourly, and
        `uncertainty_ns` is half that round trip plus half the stamp's resolution.
        `none` for a venue without such a method, or until one has answered.
      type: object
      required: [venue, method, endpoint, offset_ns, uncertainty_ns, rtt_ns, sampled_ns, samples]
      properties:
        venue: { type: string }
        method: { type: string, enum: [rest_probe, none] }
        endpoint: { type: string }
        offset_ns: { type: integer }
        uncertainty_ns: { type: integer }
        rtt_ns: { type: integer }
        sampled_ns: { $ref: "#/components/schemas/Nanos" }
        samples: { type: integer }
        drift_ns: { type: integer }
        drift_over_ns: { type: integer }

    LatencySeries:
      description: |
        Quantiles over the trailing 30-60 s; `total` and `sum_ns` since start.
        Stages: `feed` is ts_init - ts_event + offset per market-data channel,
        `internal` is receipt to shared-memory publish, `kernel_queue` (linux) is the
        kernel's receive stamp of a message's last segment to our read, per socket
        host (where measured, ts_init is that stamp), `rest` one round trip per
        endpoint, `ws_ping` a keepalive round trip per socket host, `order_ack` and
        `order_fill` from submit to the first acceptance and first fill. Negative
        values are clamped to zero and counted in `below_zero`.
      type: object
      required: [channel, stage, count, p50_ns, p90_ns, p99_ns, p999_ns, max_ns, total, sum_ns, below_zero, buckets]
      properties:
        channel: { type: string }
        stage: { type: string, enum: [feed, internal, kernel_queue, rest, ws_ping, order_ack, order_fill] }
        count: { type: integer }
        p50_ns: { type: integer }
        p90_ns: { type: integer }
        p99_ns: { type: integer }
        p999_ns: { type: integer }
        max_ns: { type: integer }
        total: { type: integer }
        sum_ns: { type: integer }
        below_zero: { type: integer }
        buckets:
          type: array
          description: |
            Since start, how many values were at or below each bound: five per decade
            from 1 us to 10 s (1000, 1585, 2512, 3981, 6310 ns, then x10). GET /metrics
            exports them as the `le` buckets of `raikiri_latency_seconds`.
          items: { type: integer }

    CacheLatency:
      type: object
      required: [account, venue, market, state, age_ms, clock, latency]
      properties:
        account: { type: string }
        venue: { type: string }
        market: { type: string }
        state: { type: string, enum: [up, stale, down] }
        age_ms: { type: integer }
        clock: { $ref: "#/components/schemas/VenueClock" }
        latency:
          type: array
          items: { $ref: "#/components/schemas/LatencySeries" }

    CacheLatencies:
      type: object
      required: [taken_ns, gateways]
      properties:
        taken_ns: { $ref: "#/components/schemas/Nanos" }
        gateways:
          type: array
          items: { $ref: "#/components/schemas/CacheLatency" }

    Account:
      type: object
      required: [account, venue, market, gateway]
      properties:
        account:
          type: string
          description: Segment name; perp is unsuffixed.
          examples: ["bybit", "bybit-spot", "deribit-opt"]
        venue: { type: string }
        market: { $ref: "#/components/schemas/MarketType" }
        gateway: { $ref: "#/components/schemas/GatewayHealth" }

    GatewayHealth:
      type: object
      required: [alive, generation, instruments, priced, coverage_pct, subscribe_refusals]
      properties:
        alive:
          type: boolean
          description: |
            The segment owner is answering. A restarted gateway is a new generation,
            and cursors, ids and books from the previous one are invalid.
        generation: { $ref: "#/components/schemas/Nanos" }
        last_heartbeat: { $ref: "#/components/schemas/Nanos" }
        instruments:
          type: integer
          description: |
            How many instruments the venue lists, regardless of what is arriving.
        priced:
          type: integer
          description: |
            How many of those have put a quote on the wire since the gateway
            started. Cumulative; read it with `last_heartbeat`, since it means little
            until a slow venue has had time to tick.
        coverage_pct:
          type: integer
          description: |
            `priced` over `instruments`, rounded down.
        subscribe_refusals:
          type: integer
          description: |
            Subscriptions the venue explicitly refused.

    MeasuredClock:
      type: object
      required: [method, endpoint, probe_failures, offset_source, correction_ns, lag_shown]
      properties:
        method:
          type: string
          enum: [rest_probe, none]
        endpoint:
          type: string
          description: Host and path of the server-time request; empty when there is none.
        offset_ns:
          type: integer
          description: Venue clock minus the local clock.
        rtt_ns:
          type: integer
          description: Round trip of the sample the offset came from.
        uncertainty_ns:
          type: integer
          description: |
            Half the width of the probe's interval: every sample in the burst says the
            venue stamped between our send and receive, and the offset is the middle of
            where they all agree.
        measured_at: { $ref: "#/components/schemas/Nanos" }
        measured_ago_ns:
          type: integer
        drift_ns:
          type: integer
          description: How far the offset moved since the measurement before.
        drift_over_ns:
          type: integer
          description: Time between those two measurements.
        probe_failures:
          type: integer
          description: Bursts in which no request answered.
        offset_source:
          type: string
          enum: [none, rest, feed, rest_and_feed, conflict]
          description: |
            What bounds the offset: the probe, the feed, the feed tightening the probe,
            or a conflict when the feed bound lies above the probe's upper edge.
        feed_bound_ns:
          type: integer
          description: |
            The largest venue stamp minus receive time over the last minute. The offset
            is at least this, since no message arrives before it is stamped.
        offset_low_ns:
          type: integer
          description: Lower edge of the combined interval; absent when open.
        offset_high_ns:
          type: integer
          description: Upper edge; absent when only the feed bounds the clock.
        correction_ns:
          type: integer
          description: |
            The point of the interval nearest zero, added to the raw lag. Zero when the
            interval holds zero, when nothing bounds the clock, and on a conflict.
        lag_shown:
          type: string
          enum: [raw, corrected]
          description: Whether the corrected lag fields are present.

    ChannelFeed:
      type: object
      required: [channel, messages, window_ns, msgs_per_s, lag_samples]
      properties:
        channel:
          type: string
          enum: [bbo, trades, depth, funding]
        messages:
          type: integer
        window_ns:
          type: integer
          description: How much of the last minute the counts cover.
        msgs_per_s:
          type: integer
        lag_samples:
          type: integer
          description: Messages that carried a venue timestamp.
        lag_p50_ns:
          type: integer
          description: Receive time minus the venue's event time, both as stamped.
        lag_p99_ns:
          type: integer
        lag_p50_corrected_ns:
          type: integer
          description: The same plus the clock's correction; absent when the raw lag stands.
        lag_p99_corrected_ns:
          type: integer
        lag_min_ns:
          type: integer
          description: The smallest raw lag over the window, exact.
        last_message_age_ns:
          type: integer

    VenueMetrics:
      type: object
      required: [account, venue, market, alive, clock, catalogue, priced, reopens, channels]
      properties:
        account:
          type: string
        venue:
          type: string
        market:
          type: string
        alive:
          type: boolean
        published_at: { $ref: "#/components/schemas/Nanos" }
        clock: { $ref: "#/components/schemas/MeasuredClock" }
        catalogue:
          type: integer
        priced:
          type: integer
          description: Instruments quoted within the last minute.
        reopens:
          type: integer
          description: Socket reopens since the gateway started.
        channels:
          type: array
          items: { $ref: "#/components/schemas/ChannelFeed" }

    ReferenceCuts:
      type: object
      required: [empty, crossed, wide, stale, no_rate, duplicate, warming, outlier]
      properties:
        empty: { type: integer }
        crossed: { type: integer }
        wide: { type: integer }
        stale: { type: integer }
        no_rate: { type: integer }
        duplicate: { type: integer }
        warming: { type: integer }
        outlier: { type: integer }

    Reference:
      type: object
      required: [asset, refused, used, used_spot, used_perp, quotes, age_ms, oldest_age_ms, cuts]
      properties:
        asset:
          type: string
          examples: ["crypto:BTC"]
        refused:
          type: boolean
          description: Fewer sources than the minimum survived; `mid` is absent.
        mid: { $ref: "#/components/schemas/Decimal" }
        spot_mid: { $ref: "#/components/schemas/Decimal" }
        perp_mid:
          $ref: "#/components/schemas/Decimal"
          description: The perps' own level, not basis-adjusted.
        basis_bp:
          $ref: "#/components/schemas/Decimal"
          description: perp_mid over mid, minus one, in basis points.
        conf:
          $ref: "#/components/schemas/Decimal"
          description: |
            Half-width in USD: the larger of half the weighted interquartile
            range and the median half-spread of the sources used.
        conf_bp: { $ref: "#/components/schemas/Decimal" }
        dispersion_bp:
          $ref: "#/components/schemas/Decimal"
          description: Weighted median absolute deviation over the mid.
        used: { type: integer }
        used_spot: { type: integer }
        used_perp: { type: integer }
        quotes:
          type: integer
          description: Books listed for the asset before any cut.
        age_ms:
          type: integer
          description: Since the cycle that wrote the row.
        oldest_age_ms:
          type: integer
          description: The oldest book among those used, at that cycle.
        cuts: { $ref: "#/components/schemas/ReferenceCuts" }

    ReferenceList:
      type: object
      required: [alive, published_at, age_ms, period_ms, took_us, cycles, gateways, unlisted, quotes, refused,
                 usdt_usd, usdc_usd, usdt_fallback, usdc_fallback, usdt_sources, usdc_sources, items]
      properties:
        alive: { type: boolean }
        published_at: { $ref: "#/components/schemas/Nanos" }
        age_ms: { type: integer }
        period_ms: { type: integer }
        took_us: { type: integer }
        cycles: { type: integer }
        gateways: { type: integer }
        unlisted:
          type: integer
          description: Gateways read without a reader slot.
        quotes: { type: integer }
        refused: { type: integer }
        usdt_usd: { $ref: "#/components/schemas/Decimal" }
        usdc_usd: { $ref: "#/components/schemas/Decimal" }
        usdt_fallback:
          type: boolean
          description: No USD book of USDT was usable; the declared rate stands in.
        usdc_fallback: { type: boolean }
        usdt_sources: { type: integer }
        usdc_sources: { type: integer }
        items:
          type: array
          items: { $ref: "#/components/schemas/Reference" }

    Health:
      type: object
      required: [gateways, database]
      properties:
        gateways:
          type: array
          items: { $ref: "#/components/schemas/Account" }
        database:
          type: object
          required: [reachable]
          properties:
            reachable: { type: boolean }
            lag_seconds:
              type: [number, "null"]
              description: |
                How far persisterd is behind the journals it tails. Null when unknown,
                which differs from zero.
        upstreams:
          type: array
          description: |
            Every service admind forwards to, by the name given to `--upstream`. An
            unconfigured one is absent. Present on `GET /v1/health` only, not on the
            stream's health frames.
          items: { $ref: "#/components/schemas/UpstreamHealth" }

    UpstreamHealth:
      type: object
      required: [name, answering]
      properties:
        name: { type: string, examples: ["strategyd"] }
        answering:
          type: boolean
          description: |
            It gave any HTTP answer within 250 ms of this request.

    StreamToken:
      type: object
      required: [token, expires_at]
      properties:
        token:
          type: string
          description: |
            Opaque; pass it as `?token=` on the `/v1/stream` upgrade before it expires.
        expires_at: { $ref: "#/components/schemas/Nanos" }

    Listing:
      type: object
      required: [instrument_id, account, venue, market, exchange_symbol, local_symbol]
      properties:
        instrument_id: { $ref: "#/components/schemas/InstrumentId" }
        account: { type: string }
        venue: { type: string }
        market: { $ref: "#/components/schemas/MarketType" }
        exchange_symbol:
          type: string
          description: |
            The venue's own name for the instrument, as orders carry it.
        local_symbol:
          type: string
          description: 'Venue-neutral, keeping a HIP-3 deployer prefix: "xyz:TSLA/USDC".'

    Market:
      type: object
      required: [key, symbol, listings]
      properties:
        key:
          type: string
          description: |
            What the listings share: asset class, underlying and quote, with USDT and
            USDC folded together. An unclassified listing keys on its local symbol.
          examples: ["equity:TSLA/USD*", "crypto:BTC/USD*"]
        symbol:
          type: string
          description: The local symbol most of the listings use.
          examples: ["BTC/USDT"]
        listings:
          type: array
          items: { $ref: "#/components/schemas/Listing" }

    Instrument:
      type: object
      required:
        [instrument_id, account, venue, market, exchange_symbol, tick_size, lot_size, contract_value, contract_kind,
         asset_class]
      properties:
        instrument_id: { $ref: "#/components/schemas/InstrumentId" }
        account: { type: string }
        venue: { type: string }
        market: { $ref: "#/components/schemas/MarketType" }
        exchange_symbol: { type: string }
        local_symbol: { type: string }
        tick_size: { $ref: "#/components/schemas/Decimal" }
        lot_size: { $ref: "#/components/schemas/Decimal" }
        min_notional: { $ref: "#/components/schemas/Decimal" }
        contract_value:
          allOf: [{ $ref: "#/components/schemas/Decimal" }]
          description: Units per contract; `contract_kind` says which units.
        contract_kind:
          type: string
          enum: [unknown, linear, inverse]
          description: |
            Linear settles in the quote currency, inverse in the base with a
            reciprocal pnl.
        asset_class:
          type: string
          enum: [unknown, crypto, equity, index, commodity, fx]
        asset_key:
          type: string
          description: |
            The asset cross-venue matching keys on, absent when the class is unknown.
          examples: ["equity:TSLA", "commodity:XAU"]
        # Dated futures and options only.
        expiry:
          allOf: [{ $ref: "#/components/schemas/Nanos" }]
          description: Absent on spot and perpetuals.
        strike:
          allOf: [{ $ref: "#/components/schemas/Decimal" }]
          description: Options only.
        put_call:
          type: string
          enum: [put, call]
          description: Options only.

    Quote:
      type: object
      required: [instrument_id, bid, bid_size, ask, ask_size, ts_event]
      properties:
        instrument_id: { $ref: "#/components/schemas/InstrumentId" }
        bid: { $ref: "#/components/schemas/Decimal" }
        bid_size: { $ref: "#/components/schemas/Decimal" }
        ask: { $ref: "#/components/schemas/Decimal" }
        ask_size: { $ref: "#/components/schemas/Decimal" }
        ts_event:
          allOf: [{ $ref: "#/components/schemas/Nanos" }]
          description: The venue's own stamp, not when this frame was built.

    BookLevel:
      type: object
      required: [price, size]
      properties:
        price: { $ref: "#/components/schemas/Decimal" }
        size: { $ref: "#/components/schemas/Decimal" }

    Book:
      type: object
      required: [instrument_id, bids, asks, ts_event]
      properties:
        instrument_id: { $ref: "#/components/schemas/InstrumentId" }
        bids:
          type: array
          description: Best first.
          items: { $ref: "#/components/schemas/BookLevel" }
        asks:
          type: array
          description: Best first.
          items: { $ref: "#/components/schemas/BookLevel" }
        ts_event: { $ref: "#/components/schemas/Nanos" }

    Greeks:
      description: |
        The venue's own option analytics, with the implied vols and underlying
        they were computed from.
      type: object
      required: [instrument_id, ts_event]
      properties:
        instrument_id: { $ref: "#/components/schemas/InstrumentId" }
        delta: { $ref: "#/components/schemas/Decimal" }
        gamma: { $ref: "#/components/schemas/Decimal" }
        vega: { $ref: "#/components/schemas/Decimal" }
        theta: { $ref: "#/components/schemas/Decimal" }
        rho: { $ref: "#/components/schemas/Decimal" }
        mark_iv:
          allOf: [{ $ref: "#/components/schemas/Decimal" }]
          description: A RATIO. 0.2524 is 25.24 %.
        bid_iv: { $ref: "#/components/schemas/Decimal" }
        ask_iv: { $ref: "#/components/schemas/Decimal" }
        underlying_price:
          allOf: [{ $ref: "#/components/schemas/Decimal" }]
          description: In the quote currency, not in the option's ticks.
        mark_price:
          allOf: [{ $ref: "#/components/schemas/Decimal" }]
          description: The option's mark in its premium currency, the coin on Deribit and USDC on Derive.
        index_price:
          allOf: [{ $ref: "#/components/schemas/Decimal" }]
          description: The underlying's spot index in the quote currency.
        ts_event: { $ref: "#/components/schemas/Nanos" }

    Funding:
      type: object
      required: [instrument_id, rate, ts_event]
      properties:
        instrument_id: { $ref: "#/components/schemas/InstrumentId" }
        rate:
          allOf: [{ $ref: "#/components/schemas/Decimal" }]
          description: A ratio per interval, not a percent and not an APR.
        predicted_rate: { $ref: "#/components/schemas/Decimal" }
        mark_price: { $ref: "#/components/schemas/Decimal" }
        index_price:
          allOf: [{ $ref: "#/components/schemas/Decimal" }]
          description: The venue's index for the contract. Absent where the venue publishes none.
        next_funding_time: { $ref: "#/components/schemas/Nanos" }
        interval_seconds:
          type: [integer, "null"]
          description: |
            The rate's own interval; hyperliquid quotes hourly, most venues per eight
            hours.
        accrual:
          type: string
          enum: [discrete, continuous]
          description: |
            Absent when the venue did not say. For `continuous`, interval_seconds is
            the rate's unit rather than a payment cadence.
        ts_event: { $ref: "#/components/schemas/Nanos" }

    Ticker:
      type: object
      required: [instrument_id, volume_24h_base, volume_24h_quote, ts_event]
      properties:
        instrument_id: { $ref: "#/components/schemas/InstrumentId" }
        volume_24h_base:
          allOf: [{ $ref: "#/components/schemas/Decimal" }]
          description: |
            Traded in the base asset over the venue's rolling 24 hours. Comparable
            only between venues with the same base.
        volume_24h_quote:
          allOf: [{ $ref: "#/components/schemas/Decimal" }]
          description: |
            The same window in the quote currency, which for a coin-margined contract
            is not dollars. Rank venues against each other on this column.
        open_interest:
          allOf: [{ $ref: "#/components/schemas/Decimal" }]
          description: |
            Open contracts in the base asset. Absent where the venue does not publish it.
        ts_event: { $ref: "#/components/schemas/Nanos" }

    ParentId:
      type: string
      pattern: '^\d+$'

    NewParentOrder:
      type: object
      required: [symbol, side]
      properties:
        symbol:
          type: string
          description: The venue-neutral symbol, as the catalogue's `local_symbol`.
          examples: ["BTC/USDT"]
        market: { type: string, enum: [perp, spot], default: perp }
        side: { $ref: "#/components/schemas/Side" }
        qty:
          allOf: [{ $ref: "#/components/schemas/Decimal" }]
          description: In the base asset. Give this or `notional`.
        notional:
          allOf: [{ $ref: "#/components/schemas/Decimal" }]
          description: In the quote asset, turned into a quantity at the arrival mid.
        limit:
          allOf: [{ $ref: "#/components/schemas/Decimal" }]
          description: No child trades through it.
        algo: { type: string, enum: [sor, twap, vwap, pov, iceberg, pegged], default: twap }
        horizon_s:
          type: integer
          minimum: 0
          maximum: 604800
          default: 0
          description: For `iceberg` and `pegged`, when to give up; zero rests until filled or cancelled.
        slices: { type: integer, minimum: 1, maximum: 10000, default: 1 }
        jitter_bp:
          type: integer
          minimum: 0
          maximum: 5000
          default: 0
          description: Each slice moves by up to this share of its interval.
        catchup_pct:
          type: integer
          minimum: 0
          default: 200
          description: How far past its planned size a slice may go to make up a shortfall.
        profile:
          type: string
          enum: [flat, u, recorded]
          default: flat
          description: The volume curve `vwap` slices by.
        pov_bp:
          type: integer
          minimum: 0
          maximum: 5000
          default: 0
          description: For `pov`, the share of market volume to trade.
        max_child_notional:
          allOf: [{ $ref: "#/components/schemas/Decimal" }]
          description: The most one child may be worth; 20 by default, as the risk gate's order limit.
        iceberg: { $ref: "#/components/schemas/IcebergParams" }
        pegged: { $ref: "#/components/schemas/PeggedParams" }
        venue:
          type: string
          description: Where `iceberg` or `pegged` rests; absent takes the best touch after the taker fee for each new child.
        post_only:
          type: boolean
          default: false
          description: >-
            `iceberg` and `pegged` only. The child stays a tick short of the other side's touch, and one the
            venue turns away is retried from a fresh book after the minimum interval.
        book:
          type: string
          description: |
            Whose the children, fills and position are. Absent is the operator's own
            `manual:<login>` through admind, or joe's own book on strategyd's port. A client
            book must already be open.
        external_ref:
          type: string
          maxLength: 40
          description: An rfq trade id or a client's order id; every child carries it.
        client_tag:
          type: string
          maxLength: 64
          description: The caller's name for this order, so a retried POST finds the first parent.

    IcebergParams:
      type: object
      description: Required with `algo` `iceberg`, which also requires `limit`.
      required: [show]
      properties:
        show:
          allOf: [{ $ref: "#/components/schemas/Decimal" }]
          description: The visible size in the base asset.
        variance_bp:
          type: integer
          minimum: 0
          maximum: 5000
          default: 0
          description: Each show moves by up to this share of its size, either way.
        refill:
          type: string
          enum: [complete, fill]
          default: complete
          description: >-
            `complete` waits for a show to fill. `fill` replaces a part-filled show at the next resend
            gap, which costs its place in the queue.

    PeggedParams:
      type: object
      properties:
        to:
          type: string
          enum: [primary, mid, market]
          default: primary
          description: The same side's touch, the mid, or the other side's touch. `limit` caps it.
        offset_ticks:
          type: integer
          minimum: -100000
          maximum: 100000
          default: 0
          description: Positive sits further from the other side, a buy lower and a sell higher. Give this or `offset_bp`.
        offset_bp: { type: integer, minimum: -1000, maximum: 1000, default: 0 }
        threshold_ticks:
          type: integer
          minimum: 1
          default: 1
          description: How far the peg must move before the child follows.
        min_interval_ms:
          type: integer
          minimum: 100
          maximum: 3600000
          default: 1000
          description: The least time between two changes to the child.

    ParentOrder:
      type: object
      required: [id, symbol, market, side, algo, profile, status, qty, filled, working, fees, horizon_s,
                 slices, slices_fired, pov_bp, created, child_count, children_retired, post_only]
      properties:
        book_id: { type: integer }
        book_kind: { $ref: "#/components/schemas/BookKind" }
        book: { type: string }
        external_ref: { type: string }
        id: { $ref: "#/components/schemas/ParentId" }
        client_tag: { type: string }
        symbol: { type: string }
        market: { type: string, enum: [perp, spot] }
        side: { $ref: "#/components/schemas/Side" }
        algo: { type: string, enum: [sor, twap, vwap, pov, iceberg, pegged] }
        profile: { type: string, enum: [flat, u, recorded] }
        status: { type: string, enum: [pending, working, paused, done, cancelled, failed] }
        reason: { type: string, description: Why it failed. }
        qty:
          allOf: [{ $ref: "#/components/schemas/Decimal" }]
          description: The target in the base asset; zero until it starts.
        filled: { $ref: "#/components/schemas/Decimal" }
        working:
          allOf: [{ $ref: "#/components/schemas/Decimal" }]
          description: Sent and not yet filled or closed.
        limit: { $ref: "#/components/schemas/Decimal" }
        arrival:
          allOf: [{ $ref: "#/components/schemas/Decimal" }]
          description: The best mid across venues when it started.
        avg_price: { $ref: "#/components/schemas/Decimal" }
        market_vwap:
          allOf: [{ $ref: "#/components/schemas/Decimal" }]
          description: Every venue's trades in the symbol while it worked.
        slippage_arrival_bp:
          allOf: [{ $ref: "#/components/schemas/Decimal" }]
          description: Positive is a cost against the arrival mid.
        slippage_vwap_bp:
          allOf: [{ $ref: "#/components/schemas/Decimal" }]
          description: Positive is a cost against the market VWAP.
        fees: { $ref: "#/components/schemas/Decimal" }
        horizon_s: { type: integer }
        slices: { type: integer }
        slices_fired: { type: integer }
        pov_bp: { type: integer }
        created: { $ref: "#/components/schemas/Nanos" }
        started: { $ref: "#/components/schemas/Nanos" }
        ended: { $ref: "#/components/schemas/Nanos" }
        child_count: { type: integer, description: Every child sent, listed or retired. }
        children_retired:
          type: integer
          description: Finished children no longer listed; they still count in the totals and the venue rows.
        children:
          type: array
          description: Only on `GET /v1/joe/parents/{id}`.
          items: { $ref: "#/components/schemas/ChildOrder" }
        venue: { type: string }
        post_only: { type: boolean }
        iceberg: { $ref: "#/components/schemas/IcebergParams" }
        pegged: { $ref: "#/components/schemas/PeggedParams" }
        working_price:
          allOf: [{ $ref: "#/components/schemas/Decimal" }]
          description: The resting child's limit.
        hold:
          type: string
          enum: [stale, crossed]
          description: Why a resting algo is waiting on its venue's book.
        version:
          type: string
          description: |
            Moves with every change to this parent and never back, across a restart too.
            Of two answers the higher is newer; digits, compare as numbers.

    ChildOrder:
      type: object
      required: [client_order_id, instrument_id, venue, qty, limit, filled, fees, sent, end, open, tif, cancelling]
      properties:
        client_order_id: { $ref: "#/components/schemas/ClientOrderId" }
        instrument_id: { $ref: "#/components/schemas/InstrumentId" }
        venue: { type: string }
        qty:
          allOf: [{ $ref: "#/components/schemas/Decimal" }]
          description: In the base asset.
        limit: { $ref: "#/components/schemas/Decimal" }
        filled: { $ref: "#/components/schemas/Decimal" }
        avg_price: { $ref: "#/components/schemas/Decimal" }
        fees: { $ref: "#/components/schemas/Decimal" }
        sent: { $ref: "#/components/schemas/Nanos" }
        acked:
          allOf: [{ $ref: "#/components/schemas/Nanos" }]
          description: The venue's first answer of any kind; less `sent` is the round trip.
        closed: { $ref: "#/components/schemas/Nanos" }
        end: { type: string, enum: [open, filled, cancelled, expired, rejected, denied, lost] }
        open: { type: boolean }
        tif: { type: string, enum: [ioc, gtc, post_only] }
        cancelling: { type: boolean, description: A cancel is out and unanswered; no replacement goes until it is. }

    ParentTrace:
      type: object
      required: [id, seq, interval_ns, mids_dropped, fills_dropped, reprices_dropped, mids, fills, reprices, venues]
      properties:
        id: { $ref: "#/components/schemas/ParentId" }
        seq: { type: integer, description: The newest entry's seq. }
        interval_ns: { $ref: "#/components/schemas/Nanos" }
        mids_dropped: { type: integer }
        fills_dropped: { type: integer }
        reprices_dropped: { type: integer }
        mids:
          type: array
          items:
            type: object
            required: [seq, ts, mid]
            properties:
              seq: { type: integer }
              ts: { $ref: "#/components/schemas/Nanos" }
              mid:
                allOf: [{ $ref: "#/components/schemas/Decimal" }]
                description: The best bid and ask across venues; the first is the arrival.
              vwap:
                allOf: [{ $ref: "#/components/schemas/Decimal" }]
                description: The market VWAP so far.
        fills:
          type: array
          items:
            type: object
            required: [seq, ts, client_order_id, venue, qty, price, fee]
            properties:
              seq: { type: integer }
              ts: { $ref: "#/components/schemas/Nanos" }
              client_order_id: { $ref: "#/components/schemas/ClientOrderId" }
              venue: { type: string }
              qty: { $ref: "#/components/schemas/Decimal" }
              price: { $ref: "#/components/schemas/Decimal" }
              fee: { $ref: "#/components/schemas/Decimal" }
        reprices:
          type: array
          description: Each change of a resting child's working price.
          items:
            type: object
            required: [seq, ts, client_order_id, qty, why]
            properties:
              seq: { type: integer }
              ts: { $ref: "#/components/schemas/Nanos" }
              client_order_id: { $ref: "#/components/schemas/ClientOrderId" }
              venue: { type: string }
              price:
                allOf: [{ $ref: "#/components/schemas/Decimal" }]
                description: The working price from here on; absent while nothing works.
              qty: { $ref: "#/components/schemas/Decimal" }
              why: { type: string, enum: [place, refill, peg, closed, rejected, stale, crossed] }
        plan:
          type: array
          description: What should have filled by each slice time; only when `since` is absent.
          items:
            type: object
            required: [ts, qty]
            properties:
              ts: { $ref: "#/components/schemas/Nanos" }
              qty: { $ref: "#/components/schemas/Decimal" }
        venues:
          type: array
          items: { $ref: "#/components/schemas/VenueTca" }

    JoeTca:
      type: object
      required: [parents, venues]
      properties:
        parents: { type: integer }
        venues:
          type: array
          items: { $ref: "#/components/schemas/VenueTca" }

    VenueTca:
      type: object
      required: [venue, children, filled_children, cancelled, rejected, acked, sent, filled, value, fees]
      properties:
        venue: { type: string }
        children: { type: integer }
        filled_children: { type: integer }
        cancelled: { type: integer, description: Cancelled or expired. }
        rejected: { type: integer, description: Rejected by the venue or denied by the risk gate. }
        acked: { type: integer }
        sent:
          allOf: [{ $ref: "#/components/schemas/Decimal" }]
          description: In the base asset.
        filled: { $ref: "#/components/schemas/Decimal" }
        value:
          allOf: [{ $ref: "#/components/schemas/Decimal" }]
          description: In the quote asset.
        fees: { $ref: "#/components/schemas/Decimal" }
        slippage_arrival_bp:
          allOf: [{ $ref: "#/components/schemas/Decimal" }]
          description: Positive is a cost against each parent's arrival mid.
        fees_bp: { $ref: "#/components/schemas/Decimal" }
        ack_p50_ns: { $ref: "#/components/schemas/Nanos" }
        ack_p90_ns: { $ref: "#/components/schemas/Nanos" }
        ack_max_ns: { $ref: "#/components/schemas/Nanos" }

    BookKind:
      type: string
      enum: [strategy, manual, client, hedge]

    BookRecord:
      type: object
      required: [id, kind, name, created]
      properties:
        id: { type: integer, minimum: 1, maximum: 65535 }
        kind: { $ref: "#/components/schemas/BookKind" }
        name: { type: string, examples: ["manual:vova", "client:acme", "hedge"] }
        created: { $ref: "#/components/schemas/Nanos" }

    NewOrder:
      type: object
      required: [account, instrument_id, side, order_type, qty]
      properties:
        account:
          type: string
          description: |
            Which gateway sends it, as `format_account` writes the name: `bybit`,
            `bybit-spot`, `bybit-fut`. Perp is the unsuffixed default.
        instrument_id: { $ref: "#/components/schemas/InstrumentId" }
        side: { $ref: "#/components/schemas/Side" }
        order_type: { type: string, enum: [limit, market] }
        tif:
          type: string
          enum: [gtc, ioc, fok]
          default: gtc
        price:
          allOf: [{ $ref: "#/components/schemas/Decimal" }]
          description: |
            Required for `limit`, refused for `market`.
        qty: { $ref: "#/components/schemas/Decimal" }
        post_only:
          type: boolean
          default: false
          description: Refused where the venue has no native post-only.
        reduce_only:
          type: boolean
          default: false
          description: |
            Only reduces a position; an order sized to close cannot open the opposite
            side.
        book:
          type: string
          description: |
            Absent is the operator's own `manual:<login>`, or the shared `manual` when
            the proxy in front named nobody. A `client:<name>` that is open may be named;
            nothing else.
        external_ref:
          type: string
          maxLength: 40
          description: A client's own order id or an rfq trade id.

    OrderAccepted:
      type: object
      required: [client_order_id, status]
      properties:
        client_order_id:
          allOf: [{ $ref: "#/components/schemas/ClientOrderId" }]
          description: Minted by the desk. Everything downstream keys on it.
        status:
          type: string
          enum: [queued]
          description: |
            The only value this endpoint returns. The venue's status appears on the
            order once it has answered.
        book_id: { type: integer }
        book:
          type: string
          description: The book it landed on; `manual` says the operator was not known.

    Order:
      type: object
      required:
        [client_order_id, instrument_id, side, order_type, tif, qty, status, ts_created, ts_updated, book_id, book_kind]
      properties:
        client_order_id: { $ref: "#/components/schemas/ClientOrderId" }
        book_id:
          type: integer
          description: The strategy half of the client order id; every order has one, however old.
        book_kind: { $ref: "#/components/schemas/BookKind" }
        book:
          type: string
          description: The registry's name. Absent for a number with nothing on record.
        parent_id:
          allOf: [{ $ref: "#/components/schemas/ParentId" }]
          description: The joe parent this is a child of; stable across restarts.
        external_ref:
          type: string
          description: An rfq trade id or a client's own order id.
        exchange_client_order_id: { type: string }
        exchange_order_id: { type: string }
        instrument_id: { $ref: "#/components/schemas/InstrumentId" }
        strategy_id: { type: integer }
        side: { $ref: "#/components/schemas/Side" }
        order_type: { type: string, enum: [limit, market] }
        tif: { type: string, enum: [gtc, ioc, fok] }
        post_only: { type: boolean }
        reduce_only: { type: boolean }
        price: { $ref: "#/components/schemas/Decimal" }
        qty: { $ref: "#/components/schemas/Decimal" }
        leaves:
          allOf: [{ $ref: "#/components/schemas/Decimal" }]
          description: |
            What is still working. The filled amount is the drop in this between two
            events, not an event's own `qty`, so a resent fill is not booked twice.
        status: { $ref: "#/components/schemas/OrderStatus" }
        reject_class:
          type: string
          enum: [terminal, retryable, rate_limited, auth_failure, connectivity]
          description: |
            How to act on the venue's refusal. Present only on a rejected order, and
            absent on one journalled before reasons were recorded.
        reject_code:
          type: integer
          format: int32
          description: |
            The venue's own numeric code, untranslated, beside `reject_class` on a
            rejection.
        ts_created: { $ref: "#/components/schemas/Nanos" }
        ts_updated: { $ref: "#/components/schemas/Nanos" }
        version:
          type: string
          description: |
            Moves with every change to this order. Of two answers about one order the
            higher is newer, whichever arrived last; digits, compare as numbers.

    OrderStatus:
      type: string
      enum:
        [initialized, denied, submitted, accepted, partially_filled, filled,
         canceled, rejected, expired, triggered, pending_update, pending_cancel]

    OrderEventType:
      type: string
      enum:
        [initialized, denied, submitted, accepted, rejected, triggered,
         pending_update, updated, modify_rejected, pending_cancel, canceled,
         cancel_rejected, expired, filled, recon_gap, recon_closed]

    OrderEvent:
      type: object
      required: [client_order_id, instrument_id, event_type, ts_event]
      properties:
        client_order_id: { $ref: "#/components/schemas/ClientOrderId" }
        instrument_id: { $ref: "#/components/schemas/InstrumentId" }
        event_type: { $ref: "#/components/schemas/OrderEventType" }
        price: { $ref: "#/components/schemas/Decimal" }
        qty: { $ref: "#/components/schemas/Decimal" }
        leaves: { $ref: "#/components/schemas/Decimal" }
        fee: { $ref: "#/components/schemas/Decimal" }
        exec_id: { type: string }
        ts_event: { $ref: "#/components/schemas/Nanos" }

    Fill:
      type: object
      required: [venue, exec_id, instrument_id, side, price, qty, ts_event]
      properties:
        book_id:
          type: integer
          description: The strategy half of the client order id; every order has one, however old.
        book_kind: { $ref: "#/components/schemas/BookKind" }
        book:
          type: string
          description: The registry's name. Absent for a number with nothing on record.
        parent_id:
          allOf: [{ $ref: "#/components/schemas/ParentId" }]
          description: The joe parent this is a child of; stable across restarts.
        external_ref:
          type: string
          description: An rfq trade id or a client's own order id.
        venue: { type: string }
        exec_id:
          type: string
          description: |
            The venue's own unique id; dedup keys on it together with the venue.
        client_order_id: { $ref: "#/components/schemas/ClientOrderId" }
        exchange_order_id: { type: string }
        instrument_id: { $ref: "#/components/schemas/InstrumentId" }
        side: { $ref: "#/components/schemas/Side" }
        price: { $ref: "#/components/schemas/Decimal" }
        qty: { $ref: "#/components/schemas/Decimal" }
        fee: { $ref: "#/components/schemas/Decimal" }
        liquidity: { type: string, enum: [maker, taker, internal, unknown] }
        ts_event: { $ref: "#/components/schemas/Nanos" }

    Position:
      type: object
      required: [instrument_id, strategy_id, qty, ts_updated]
      properties:
        instrument_id: { $ref: "#/components/schemas/InstrumentId" }
        strategy_id: { type: integer, description: The book's id. }
        book_kind: { $ref: "#/components/schemas/BookKind" }
        book: { type: string }
        qty:
          allOf: [{ $ref: "#/components/schemas/Decimal" }]
          description: Signed; positive is long.
        avg_entry_price:
          allOf: [{ $ref: "#/components/schemas/Decimal" }]
          description: |
            Derived from this system's own cost basis, not the venue's average.
        realized: { $ref: "#/components/schemas/Decimal" }
        venue_qty:
          type: [string, "null"]
          description: |
            What the venue last said it holds, or null when it has not said anything
            recently. Null does not mean flat.
        venue_reported_at:
          type: [string, "null"]
          description: When that snapshot was taken. Null when there is none.
        ts_updated: { $ref: "#/components/schemas/Nanos" }
        version:
          type: string
          description: |
            Of two answers about one position the higher is newer, whichever arrived
            last; digits, compare as numbers.

    Balance:
      type: object
      required: [asset]
      properties:
        asset: { type: string, examples: ["USDT"] }
        total:
          allOf: [{ $ref: "#/components/schemas/Decimal" }]
          description: |
            The venue's own total for this asset. Absent when it did not say, which
            differs from zero.
        available:
          allOf: [{ $ref: "#/components/schemas/Decimal" }]
          description: |
            What may be committed to a new order. Absent where the venue publishes
            only a total.
        unrealized:
          allOf: [{ $ref: "#/components/schemas/Decimal" }]
          description: On the venue's marks, reported and never recomputed here.

    AccountBalances:
      type: object
      required: [account, venue, stale, assets]
      properties:
        account: { type: string }
        venue: { type: string }
        reported_at:
          type: [string, "null"]
          description: |
            When the venue last answered, in nanoseconds. Null when it has not, and
            `assets` is then empty.
        stale:
          type: boolean
          description: |
            True once the last answer is older than three of the gateway's pull
            rounds. The figures are the last ones the venue gave.
        wallet:
          type: string
          enum: [spot, futures, unified, options, funding, unknown]
          description: |
            Which of the venue's wallets this account reads. A unified wallet backs
            several markets, so every account of the venue that reports it shows the
            same money; count it once per venue. Absent until the venue answers.
        assets:
          type: array
          items: { $ref: "#/components/schemas/Balance" }

    PnlKind:
      type: string
      enum: [realized, fee, funding]

    PnlIncrement:
      type: object
      required: [source_id, account, kind, amount, ts_event]
      properties:
        source_id:
          type: string
          description: |
            The idempotency key the ledger dedupes on.
        account: { type: string }
        kind: { $ref: "#/components/schemas/PnlKind" }
        instrument_id: { $ref: "#/components/schemas/InstrumentId" }
        strategy_id: { type: integer, description: The book's id. }
        book_kind: { $ref: "#/components/schemas/BookKind" }
        book: { type: string }
        parent_id: { $ref: "#/components/schemas/ParentId" }
        amount:
          allOf: [{ $ref: "#/components/schemas/Decimal" }]
          description: Signed; positive is money gained.
        ts_event: { $ref: "#/components/schemas/Nanos" }

    FundingObservation:
      allOf:
        - { $ref: "#/components/schemas/Funding" }
        - type: object
          properties:
            observed_at: { $ref: "#/components/schemas/Nanos" }

    UpstreamIndex:
      type: object
      required: [tables]
      description: |
        What an upstream serves, so a screen can offer a tab per table.
      properties:
        tables:
          type: array
          items:
            type: object
            required: [path, title]
            properties:
              path: { type: string, description: Appended to the upstream's own prefix. }
              title: { type: string }

    UpstreamColumn:
      type: object
      required: [key, label]
      properties:
        key: { type: string, description: The field each row carries this column under. }
        label: { type: string, description: What the header says. The upstream names its own columns. }
        kind:
          type: string
          enum: [text, number, signed, venue, duration]
          default: text
          description: |
            How to draw it: `signed` is painted by sign, `venue` as a venue mark,
            `duration` as time remaining to a nanosecond instant.
        align: { type: string, enum: [left, right], default: left }

    UpstreamTable:
      type: object
      required: [columns, rows]
      description: |
        A table an upstream describes and a generic screen draws; the columns
        come with the data.
      properties:
        title: { type: string }
        ts: { $ref: "#/components/schemas/Nanos" }
        note:
          type: string
          description: |
            Shown when there are no rows.
        columns:
          type: array
          items: { $ref: "#/components/schemas/UpstreamColumn" }
        rows:
          type: array
          items:
            type: object
            additionalProperties: { type: string }
        venues:
          type: array
          items: { type: string }
          description: |
            Every venue the upstream reads, named as the rows name them, so a filter
            can offer venues the shown rows happen to miss.

    ReconVerdict:
      type: string
      enum: [break, unknown]
      description: |
        `unknown` means the venue did not answer, not agreement. Agreeing
        instruments are not recorded.

    ReconBreak:
      type: object
      required: [venue, instrument_id, verdict, ts_seen]
      properties:
        venue: { type: string }
        instrument_id: { $ref: "#/components/schemas/InstrumentId" }
        symbol: { type: string }
        verdict: { $ref: "#/components/schemas/ReconVerdict" }
        local_qty: { $ref: "#/components/schemas/Decimal" }
        venue_qty: { $ref: "#/components/schemas/Decimal" }
        detail: { type: string }
        ts_seen: { $ref: "#/components/schemas/Nanos" }

    StreamSubscribe:
      type: object
      required: [op, id]
      properties:
        op: { type: string, const: subscribe }
        id:
          type: string
          description: The client's handle; echoed on the ack and every frame.
        quotes:
          type: array
          items: { $ref: "#/components/schemas/InstrumentId" }
        book: { $ref: "#/components/schemas/InstrumentId" }
        greeks:
          type: array
          items: { $ref: "#/components/schemas/InstrumentId" }
        funding:
          type: array
          items: { $ref: "#/components/schemas/InstrumentId" }
        ticker:
          type: array
          items: { $ref: "#/components/schemas/InstrumentId" }
        events:
          type: array
          items: { type: string, enum: [orders, fills, recon, positions, health] }
        hz:
          type: number
          description: |
            Requested cadence for the state subscriptions in this message. The ack
            states what the server will do, capped at its sampling rate.

    StreamUnsubscribe:
      type: object
      required: [op, id]
      properties:
        op: { type: string, const: unsubscribe }
        id: { type: string }

    StreamAck:
      type: object
      required: [type, id]
      properties:
        type: { type: string, const: ack }
        id: { type: string }
        hz: { type: number }

    StreamQuotes:
      type: object
      required: [type, id, ts, quotes]
      properties:
        type: { type: string, const: quotes }
        id: { type: string }
        ts: { $ref: "#/components/schemas/Nanos" }
        quotes:
          type: array
          description: Only what changed since the last frame of this subscription.
          items: { $ref: "#/components/schemas/Quote" }

    StreamBook:
      type: object
      required: [type, id, ts, book]
      properties:
        type: { type: string, const: book }
        id: { type: string }
        ts: { $ref: "#/components/schemas/Nanos" }
        book: { $ref: "#/components/schemas/Book" }

    StreamGreeks:
      type: object
      required: [type, id, ts, greeks]
      properties:
        type: { type: string, const: greeks }
        id: { type: string }
        ts: { $ref: "#/components/schemas/Nanos" }
        greeks:
          type: array
          items: { $ref: "#/components/schemas/Greeks" }

    StreamFunding:
      type: object
      required: [type, id, ts, funding]
      properties:
        type: { type: string, const: funding }
        id: { type: string }
        ts: { $ref: "#/components/schemas/Nanos" }
        funding:
          type: array
          items: { $ref: "#/components/schemas/Funding" }

    StreamTicker:
      type: object
      required: [type, id, ts, ticker]
      properties:
        type: { type: string, const: ticker }
        id: { type: string }
        ts: { $ref: "#/components/schemas/Nanos" }
        ticker:
          type: array
          items: { $ref: "#/components/schemas/Ticker" }

    StreamPositions:
      type: object
      required: [type, id, ts, positions]
      properties:
        type: { type: string, const: positions }
        id: { type: string }
        ts: { $ref: "#/components/schemas/Nanos" }
        positions:
          type: array
          items: { $ref: "#/components/schemas/Position" }

    StreamHealth:
      type: object
      required: [type, id, ts, health]
      properties:
        type: { type: string, const: health }
        id: { type: string }
        ts: { $ref: "#/components/schemas/Nanos" }
        health: { $ref: "#/components/schemas/Health" }

    StreamEvent:
      description: |
        A sequenced event, never coalesced.
      type: object
      required: [type, id, seq]
      properties:
        type: { type: string, const: event }
        id: { type: string }
        seq:
          allOf: [{ $ref: "#/components/schemas/Nanos" }]
          description: Monotonic per subscription; the cursor for `gap`.
        order_event: { $ref: "#/components/schemas/OrderEvent" }
        fill: { $ref: "#/components/schemas/Fill" }
        recon_break: { $ref: "#/components/schemas/ReconBreak" }

    StreamGap:
      description: |
        The server's ring overran and events were lost. Refetch the affected
        resource.
      type: object
      required: [type, id, missed]
      properties:
        type: { type: string, const: gap }
        id: { type: string }
        missed: { $ref: "#/components/schemas/Nanos" }

    StreamProblem:
      type: object
      required: [type, problem]
      properties:
        type: { type: string, const: problem }
        id: { type: string }
        problem: { $ref: "#/components/schemas/Problem" }

    OptionUnit:
      type: string
      description: "`base` is the underlying coin, `quote` is USD or a stablecoin."
      enum: [base, quote, unknown]

    Figure:
      type: string
      description: "`venue` when the venue published it, `model` when Black-76 computed it here."
      enum: [venue, model, none]

    ForwardSource:
      type: string
      enum: [parity, venue, index, none]

    OptionExpiry:
      type: object
      required: [expiry, date, strikes, venues]
      properties:
        expiry: { $ref: "#/components/schemas/Nanos" }
        date: { type: string, description: "UTC, YYYYMMDD." }
        strikes: { type: integer, description: Distinct strikes across venues. }
        venues: { type: array, items: { type: string } }

    OptionUnderlying:
      type: object
      required: [underlying, venues, expiries]
      properties:
        underlying: { type: string, examples: ["BTC"] }
        venues:
          type: array
          items:
            type: object
            required: [venue, options]
            properties:
              venue: { type: string }
              options: { type: integer }
        expiries:
          type: array
          description: Nearest first.
          items: { $ref: "#/components/schemas/OptionExpiry" }

    OptionRiskFlag:
      description: |
        Why a position's figures are in doubt. `mark_model` means no quoted mark, so
        the model priced it at the venue's iv.
      type: string
      enum: [mark_missing, mark_stale, mark_model, greeks_missing, greeks_stale, position_stale, entry_missing, rate_missing]

    OptionRiskPosition:
      type: object
      required: [account, venue, instrument_id, symbol, underlying, expiry, expiry_date, strike, put_call, premium_unit, contracts, contract_value, mark_source, flags, as_of]
      properties:
        account: { type: string }
        venue: { type: string }
        instrument_id: { $ref: "#/components/schemas/InstrumentId" }
        symbol: { type: string }
        underlying: { type: string }
        expiry: { $ref: "#/components/schemas/Nanos" }
        expiry_date: { type: string, examples: ["20261127"] }
        strike: { $ref: "#/components/schemas/Decimal" }
        put_call: { type: string, enum: [call, put] }
        premium_unit: { type: string, enum: [base, quote, unknown] }
        contracts: { $ref: "#/components/schemas/Decimal" }
        contract_value: { $ref: "#/components/schemas/Decimal" }
        units: { $ref: "#/components/schemas/Decimal" }
        days_to_expiry: { $ref: "#/components/schemas/Decimal" }
        entry: { $ref: "#/components/schemas/Decimal" }
        mark: { $ref: "#/components/schemas/Decimal" }
        mark_source: { type: string, enum: [venue, mid, model, none] }
        mark_ts: { $ref: "#/components/schemas/Nanos" }
        vol: { $ref: "#/components/schemas/Decimal" }
        forward: { $ref: "#/components/schemas/Decimal" }
        rate: { $ref: "#/components/schemas/Decimal" }
        delta_coin: { $ref: "#/components/schemas/Decimal" }
        delta_adjusted_coin: { $ref: "#/components/schemas/Decimal" }
        delta_usd: { $ref: "#/components/schemas/Decimal" }
        gamma: { $ref: "#/components/schemas/Decimal" }
        gamma_usd_1pct: { $ref: "#/components/schemas/Decimal" }
        vega_usd: { $ref: "#/components/schemas/Decimal" }
        theta_usd: { $ref: "#/components/schemas/Decimal" }
        premium: { $ref: "#/components/schemas/Decimal" }
        premium_usd: { $ref: "#/components/schemas/Decimal" }
        value: { $ref: "#/components/schemas/Decimal" }
        value_usd: { $ref: "#/components/schemas/Decimal" }
        unrealized: { $ref: "#/components/schemas/Decimal" }
        unrealized_usd: { $ref: "#/components/schemas/Decimal" }
        realized: { $ref: "#/components/schemas/Decimal" }
        realized_usd: { $ref: "#/components/schemas/Decimal" }
        flags:
          type: array
          items: { $ref: "#/components/schemas/OptionRiskFlag" }
        as_of: { $ref: "#/components/schemas/Nanos" }

    OptionRiskAwaiting:
      description: Past expiry with no price to settle at yet.
      type: object
      required: [account, venue, instrument_id, symbol, underlying, expiry, contracts]
      properties:
        account: { type: string }
        venue: { type: string }
        instrument_id: { $ref: "#/components/schemas/InstrumentId" }
        symbol: { type: string }
        underlying: { type: string }
        expiry: { $ref: "#/components/schemas/Nanos" }
        contracts: { $ref: "#/components/schemas/Decimal" }

    OptionRiskSettled:
      description: |
        A position booked at expiry. `late` says an index read over five minutes
        past expiry; `from_last_seen` that the venue had already cleared the
        position, so its size is the last one reported. `realized` is gross of
        any delivery fee and null when the venue gave no entry.
      type: object
      required: [account, venue, instrument_id, symbol, underlying, expiry, strike, put_call, premium_unit, price, price_source, price_ts, settled_at, from_last_seen, late]
      properties:
        account: { type: string }
        venue: { type: string }
        instrument_id: { $ref: "#/components/schemas/InstrumentId" }
        symbol: { type: string }
        underlying: { type: string }
        expiry: { $ref: "#/components/schemas/Nanos" }
        strike: { $ref: "#/components/schemas/Decimal" }
        put_call: { type: string, enum: [call, put] }
        premium_unit: { type: string, enum: [base, quote, unknown] }
        units: { $ref: "#/components/schemas/Decimal" }
        entry: { $ref: "#/components/schemas/Decimal" }
        price: { $ref: "#/components/schemas/Decimal" }
        price_source: { type: string, enum: [venue, index] }
        price_ts: { $ref: "#/components/schemas/Nanos" }
        settled_at: { $ref: "#/components/schemas/Nanos" }
        from_last_seen: { type: boolean }
        late: { type: boolean }
        payoff: { $ref: "#/components/schemas/Decimal" }
        proceeds: { $ref: "#/components/schemas/Decimal" }
        proceeds_usd: { $ref: "#/components/schemas/Decimal" }
        realized: { $ref: "#/components/schemas/Decimal" }
        realized_usd: { $ref: "#/components/schemas/Decimal" }

    OptionRiskTotals:
      description: Coin figures are absent where the total mixes underlyings.
      type: object
      required: [delta_usd, gamma_usd_1pct, vega_usd, theta_usd, premium_usd, value_usd, unrealized_usd, realized_usd, positions, incomplete, settled]
      properties:
        delta_coin: { $ref: "#/components/schemas/Decimal" }
        delta_adjusted_coin: { $ref: "#/components/schemas/Decimal" }
        delta_usd: { $ref: "#/components/schemas/Decimal" }
        gamma: { $ref: "#/components/schemas/Decimal" }
        gamma_usd_1pct: { $ref: "#/components/schemas/Decimal" }
        vega_usd: { $ref: "#/components/schemas/Decimal" }
        theta_usd: { $ref: "#/components/schemas/Decimal" }
        premium_usd: { $ref: "#/components/schemas/Decimal" }
        value_usd: { $ref: "#/components/schemas/Decimal" }
        unrealized_usd: { $ref: "#/components/schemas/Decimal" }
        realized_usd: { $ref: "#/components/schemas/Decimal" }
        positions: { type: integer }
        incomplete: { type: integer }
        settled: { type: integer }

    OptionRisk:
      type: object
      required: [as_of, stale, realized_available, positions, awaiting_settlement, settled, by_underlying, by_expiry, total]
      properties:
        as_of: { $ref: "#/components/schemas/Nanos" }
        stale:
          type: boolean
          description: A mark or greek is old or missing, a position is stale, or one awaits settlement.
        realized_available: { type: boolean }
        positions:
          type: array
          items: { $ref: "#/components/schemas/OptionRiskPosition" }
        awaiting_settlement:
          type: array
          items: { $ref: "#/components/schemas/OptionRiskAwaiting" }
        settled:
          type: array
          items: { $ref: "#/components/schemas/OptionRiskSettled" }
        by_underlying:
          type: array
          items:
            type: object
            required: [underlying, totals]
            properties:
              underlying: { type: string }
              totals: { $ref: "#/components/schemas/OptionRiskTotals" }
        by_expiry:
          type: array
          description: By underlying, nearest first; a settled expiry stays with its realized P&L.
          items:
            type: object
            required: [underlying, expiry, expiry_date, totals]
            properties:
              underlying: { type: string }
              expiry: { $ref: "#/components/schemas/Nanos" }
              expiry_date: { type: string }
              days_to_expiry: { $ref: "#/components/schemas/Decimal" }
              totals: { $ref: "#/components/schemas/OptionRiskTotals" }
        total: { $ref: "#/components/schemas/OptionRiskTotals" }

    OptionRiskCell:
      type: object
      required: [spot, vol, worst]
      properties:
        spot: { $ref: "#/components/schemas/Decimal", description: Percent move. }
        vol: { $ref: "#/components/schemas/Decimal", description: Vol points. }
        value_usd: { $ref: "#/components/schemas/Decimal" }
        pnl_usd: { $ref: "#/components/schemas/Decimal" }
        worst: { type: boolean }

    OptionRiskScenarios:
      type: object
      required: [underlying, spot, vol, cells, base_value_usd, positions, excluded]
      properties:
        underlying: { type: string }
        spot:
          type: array
          items: { $ref: "#/components/schemas/Decimal" }
        vol:
          type: array
          items: { $ref: "#/components/schemas/Decimal" }
        cells:
          type: array
          description: A row per vol, a column per spot.
          items: { $ref: "#/components/schemas/OptionRiskCell" }
        worst:
          type: object
          required: [spot, vol, pnl_usd]
          properties:
            spot: { $ref: "#/components/schemas/Decimal" }
            vol: { $ref: "#/components/schemas/Decimal" }
            pnl_usd: { $ref: "#/components/schemas/Decimal" }
        base_value_usd: { $ref: "#/components/schemas/Decimal" }
        positions: { type: integer }
        excluded:
          type: array
          items: { $ref: "#/components/schemas/InstrumentId" }

    OptionQuote:
      description: |
        One venue's listing. `bid`, `ask` and `mark` are in `premium_unit`;
        the `_usd` figures are in the quote currency, a coin premium converted at
        the venue's index. Sizes are the venue's quantity. IVs are ratios.
        Venue greeks are in `greeks_unit`; model greeks are per one unit of the
        underlying, in USD, vega per vol point and theta per day.
      type: object
      required: [venue, instrument_id, symbol, premium_unit, iv_source, greeks_source, ts_event]
      properties:
        venue: { type: string }
        instrument_id: { $ref: "#/components/schemas/InstrumentId" }
        symbol: { type: string }
        premium_unit: { $ref: "#/components/schemas/OptionUnit" }
        bid: { $ref: "#/components/schemas/Decimal" }
        ask: { $ref: "#/components/schemas/Decimal" }
        bid_size: { $ref: "#/components/schemas/Decimal" }
        ask_size: { $ref: "#/components/schemas/Decimal" }
        mark: { $ref: "#/components/schemas/Decimal" }
        bid_usd: { $ref: "#/components/schemas/Decimal" }
        ask_usd: { $ref: "#/components/schemas/Decimal" }
        mark_usd: { $ref: "#/components/schemas/Decimal" }
        bid_iv: { $ref: "#/components/schemas/Decimal" }
        ask_iv: { $ref: "#/components/schemas/Decimal" }
        mark_iv: { $ref: "#/components/schemas/Decimal" }
        iv_source: { $ref: "#/components/schemas/Figure" }
        delta: { $ref: "#/components/schemas/Decimal" }
        gamma: { $ref: "#/components/schemas/Decimal" }
        vega: { $ref: "#/components/schemas/Decimal" }
        theta: { $ref: "#/components/schemas/Decimal" }
        greeks_source: { $ref: "#/components/schemas/Figure" }
        greeks_unit: { $ref: "#/components/schemas/OptionUnit" }
        open_interest:
          allOf: [{ $ref: "#/components/schemas/Decimal" }]
          description: In the base asset.
        volume_24h:
          allOf: [{ $ref: "#/components/schemas/Decimal" }]
          description: In the base asset.
        ts_event: { $ref: "#/components/schemas/Nanos" }

    OptionBest:
      type: object
      required: [venue, usd]
      properties:
        venue: { type: string }
        usd: { $ref: "#/components/schemas/Decimal" }
        iv: { $ref: "#/components/schemas/Decimal" }
        size: { $ref: "#/components/schemas/Decimal" }

    OptionSide:
      type: object
      required: [venues]
      properties:
        venues: { type: array, items: { $ref: "#/components/schemas/OptionQuote" } }
        best_bid: { $ref: "#/components/schemas/OptionBest" }
        best_ask: { $ref: "#/components/schemas/OptionBest" }

    OptionChain:
      type: object
      required: [underlying, expiry, date, as_of, seconds_to_expiry, forward_source, venues, rows]
      properties:
        underlying: { type: string }
        expiry: { $ref: "#/components/schemas/Nanos" }
        date: { type: string }
        as_of: { $ref: "#/components/schemas/Nanos" }
        years:
          allOf: [{ $ref: "#/components/schemas/Decimal" }]
          description: Act/365 to expiry.
        seconds_to_expiry: { type: integer }
        forward: { $ref: "#/components/schemas/Decimal" }
        forward_source: { $ref: "#/components/schemas/ForwardSource" }
        atm_strike:
          allOf: [{ $ref: "#/components/schemas/Decimal" }]
          description: The listed strike nearest the forward.
        venues:
          type: array
          items:
            type: object
            required: [venue]
            properties:
              venue: { type: string }
              index:
                allOf: [{ $ref: "#/components/schemas/Decimal" }]
                description: What the venue's coin premiums are converted at.
              underlying:
                allOf: [{ $ref: "#/components/schemas/Decimal" }]
                description: The venue's own forward for this expiry.
        rows:
          type: array
          description: Strike ascending.
          items:
            type: object
            required: [strike, call, put]
            properties:
              strike: { $ref: "#/components/schemas/Decimal" }
              call: { $ref: "#/components/schemas/OptionSide" }
              put: { $ref: "#/components/schemas/OptionSide" }

    OptionResidual:
      type: object
      required: [venue, quotes, mean]
      properties:
        venue: { type: string }
        quotes: { type: integer }
        mean:
          allOf: [{ $ref: "#/components/schemas/Decimal" }]
          description: Mid vol minus the fit; positive is rich.
        rms: { $ref: "#/components/schemas/Decimal" }

    OptionSurfaceExpiry:
      type: object
      required: [expiry, date, forward_source, fitted, smile, residuals]
      properties:
        expiry: { $ref: "#/components/schemas/Nanos" }
        date: { type: string }
        years: { $ref: "#/components/schemas/Decimal" }
        forward: { $ref: "#/components/schemas/Decimal" }
        forward_source: { $ref: "#/components/schemas/ForwardSource" }
        atm_iv: { $ref: "#/components/schemas/Decimal" }
        rr25:
          allOf: [{ $ref: "#/components/schemas/Decimal" }]
          description: Vol at the 25-delta call minus vol at the 25-delta put.
        bf25:
          allOf: [{ $ref: "#/components/schemas/Decimal" }]
          description: Their mean minus the ATM vol.
        call25_strike: { $ref: "#/components/schemas/Decimal" }
        put25_strike: { $ref: "#/components/schemas/Decimal" }
        fit:
          type: object
          required: [svi, quotes, dropped]
          properties:
            svi:
              type: object
              description: "Raw SVI in total variance: w(k) = a + b(ρ(k − m) + √((k − m)² + σ²)), k = ln(K/F)."
              required: [a, b, rho, m, sigma]
              properties:
                a: { $ref: "#/components/schemas/Decimal" }
                b: { $ref: "#/components/schemas/Decimal" }
                rho: { $ref: "#/components/schemas/Decimal" }
                m: { $ref: "#/components/schemas/Decimal" }
                sigma: { $ref: "#/components/schemas/Decimal" }
            quotes: { type: integer }
            dropped: { type: integer, description: Stale, crossed, one-sided, too wide or too far out. }
            svi_rmse: { $ref: "#/components/schemas/Decimal" }
            ssvi_rmse: { $ref: "#/components/schemas/Decimal" }
            inside:
              allOf: [{ $ref: "#/components/schemas/Decimal" }]
              description: Share of quotes the model prices inside bid/ask.
        fitted:
          type: array
          description: The chosen model across the quoted strikes.
          items:
            type: object
            required: [strike, vol]
            properties:
              strike: { $ref: "#/components/schemas/Decimal" }
              vol: { $ref: "#/components/schemas/Decimal" }
        smile:
          type: array
          description: Out-of-the-money quotes only, vols implied on each venue's own forward.
          items:
            type: object
            required: [venue, strike, put_call, mid_iv]
            properties:
              venue: { type: string }
              strike: { $ref: "#/components/schemas/Decimal" }
              put_call: { type: string, enum: [call, put] }
              mid_iv: { $ref: "#/components/schemas/Decimal" }
              bid_iv: { $ref: "#/components/schemas/Decimal" }
              ask_iv: { $ref: "#/components/schemas/Decimal" }
        residuals:
          type: array
          items: { $ref: "#/components/schemas/OptionResidual" }

    OptionSurface:
      type: object
      required: [underlying, as_of, model, calendar_repair, butterfly_points, calendar_points, venues, expiries]
      properties:
        underlying: { type: string }
        as_of: { $ref: "#/components/schemas/Nanos" }
        model: { type: string, enum: [ssvi, svi, none] }
        rmse: { $ref: "#/components/schemas/Decimal" }
        ssvi:
          type: object
          required: [rho, eta, gamma]
          properties:
            rho: { $ref: "#/components/schemas/Decimal" }
            eta: { $ref: "#/components/schemas/Decimal" }
            gamma: { $ref: "#/components/schemas/Decimal" }
        calendar_repair: { type: boolean }
        butterfly_points: { type: integer }
        calendar_points: { type: integer }
        venues:
          type: array
          description: Residuals over every expiry.
          items: { $ref: "#/components/schemas/OptionResidual" }
        expiries:
          type: array
          description: Nearest first.
          items: { $ref: "#/components/schemas/OptionSurfaceExpiry" }

    StreamFrame:
      description: Anything the server sends; `type` selects the variant.
      oneOf:
        - { $ref: "#/components/schemas/StreamAck" }
        - { $ref: "#/components/schemas/StreamQuotes" }
        - { $ref: "#/components/schemas/StreamBook" }
        - { $ref: "#/components/schemas/StreamGreeks" }
        - { $ref: "#/components/schemas/StreamFunding" }
        - { $ref: "#/components/schemas/StreamTicker" }
        - { $ref: "#/components/schemas/StreamPositions" }
        - { $ref: "#/components/schemas/StreamHealth" }
        - { $ref: "#/components/schemas/StreamEvent" }
        - { $ref: "#/components/schemas/StreamGap" }
        - { $ref: "#/components/schemas/StreamProblem" }
      discriminator:
        propertyName: type
        # explicit mapping; without it the discriminator value defaults to the schema name
        mapping:
          ack: "#/components/schemas/StreamAck"
          quotes: "#/components/schemas/StreamQuotes"
          book: "#/components/schemas/StreamBook"
          greeks: "#/components/schemas/StreamGreeks"
          funding: "#/components/schemas/StreamFunding"
          ticker: "#/components/schemas/StreamTicker"
          positions: "#/components/schemas/StreamPositions"
          health: "#/components/schemas/StreamHealth"
          event: "#/components/schemas/StreamEvent"
          gap: "#/components/schemas/StreamGap"
          problem: "#/components/schemas/StreamProblem"
