# What each venue lets us ask of it, and what each request costs there.
#
# THESE NUMBERS WERE MEASURED, not read off a documentation page, and the venue
# states them in its own response headers — binance in `X-MBX-USED-WEIGHT-1M`,
# bybit in `X-Bapi-Limit`. Re-measure rather than edit from memory when a venue
# changes: a budget that is wrong in the generous direction is a ban, and one
# that is wrong the other way silently throttles the desk.
#
# TWO SHAPES. binance meters ONE POOL of weight across every endpoint, so it
# fills `shared` and leaves the rest at zero. bybit meters EACH ENDPOINT
# separately, so it fills the per-purpose buckets and leaves `shared` at zero.
# A bucket with capacity 0 is disabled — a venue whose budget nobody has
# established must not have one invented for it, because refusing traffic the
# venue would have accepted is the worse of the two errors.
#
# `reserve` is the part of a bucket only ORDER traffic may spend. It exists so
# a reconciliation sweep can never consume the allowance a cancel is about to
# need: a cancel that cannot be sent is an open position the strategy believes
# is closed.
#
# A VENUE NOT LISTED HERE IS UNLIMITED, and eight of the seventeen are not
# listed because they state no metering header at all on the traffic this
# gateway makes — okx, mexc, deribit, hyperliquid, coinbase, kraken, bitmex and
# bitfinex. Two more are listed with zeroes because what they do state is a
# remainder without a ceiling. Not listing them is the honest reading; the
# order-answer timeout does not depend on it and applies at its default either
# way.

venues:
  binance:
    # How long an order may go unanswered before the gateway says so out loud.
    # Longer than the REST client's own 5s deadline on purpose: this is not a
    # second timeout, it is the point at which an unanswered order stops being
    # "in flight" and becomes a fact somebody has to look at.
    order_answer_timeout_ms: 15000
    rate:
      # Measured 2026-09-01: 2400 weight per minute per IP. A tenth is held
      # back for order entry, which is far more than order traffic can spend.
      shared: { capacity: 2400, window_ms: 60000, reserve: 240 }
      order_entry: { capacity: 0, window_ms: 0, reserve: 0 }
      account: { capacity: 0, window_ms: 0, reserve: 0 }
      ledger: { capacity: 0, window_ms: 0, reserve: 0 }
      # Weight per call, measured by reading the used-weight header before and
      # after each: the income ledger costs six times what a balance does.
      costs: { order: 1, positions: 5, balances: 5, ledger: 30 }

  bybit:
    order_answer_timeout_ms: 15000
    rate:
      shared: { capacity: 0, window_ms: 0, reserve: 0 }
      # Measured 2026-09-01 from X-Bapi-Limit: fifty a second on positions,
      # balances and open orders; twenty-five on the transaction log.
      order_entry: { capacity: 50, window_ms: 1000, reserve: 10 }
      account: { capacity: 50, window_ms: 1000, reserve: 10 }
      ledger: { capacity: 25, window_ms: 1000, reserve: 0 }
      # bybit counts requests, not weight, so every call costs one.
      costs: { order: 1, positions: 1, balances: 1, ledger: 1 }

  gate:
    order_answer_timeout_ms: 15000
    rate:
      # Measured 2026-09-06 from X-Gate-RateLimit-Limit and
      # X-Gate-RateLimit-Reset-Timestamp on api.gateio.ws: 200, and the reset
      # named the very second the response was read in, so the window is one
      # second and not the ten a longer reset would have meant.
      shared: { capacity: 200, window_ms: 1000, reserve: 20 }
      order_entry: { capacity: 0, window_ms: 0, reserve: 0 }
      account: { capacity: 0, window_ms: 0, reserve: 0 }
      ledger: { capacity: 0, window_ms: 0, reserve: 0 }
      # Gate counts requests, not weight.
      costs: { order: 1, positions: 1, balances: 1, ledger: 1 }

  kucoin:
    order_answer_timeout_ms: 15000
    rate:
      # Measured 2026-09-06 from gw-ratelimit-limit and gw-ratelimit-reset on
      # api-futures.kucoin.com: 2000 across the pool, and the reset counted
      # 27.7 s down from a full one, which is the 30 s window.
      shared: { capacity: 2000, window_ms: 30000, reserve: 200 }
      order_entry: { capacity: 0, window_ms: 0, reserve: 0 }
      account: { capacity: 0, window_ms: 0, reserve: 0 }
      ledger: { capacity: 0, window_ms: 0, reserve: 0 }
      # KuCoin counts requests, not weight.
      costs: { order: 1, positions: 1, balances: 1, ledger: 1 }

  xt:
    order_answer_timeout_ms: 15000
    rate:
      # Measured 2026-09-06 from X-RateLimit-Burst-Capacity and
      # X-RateLimit-Replenish-Rate on fapi.xt.com: a token bucket holding 1000
      # and refilling 1000 a second, which is a 1000-per-second allowance.
      shared: { capacity: 1000, window_ms: 1000, reserve: 100 }
      order_entry: { capacity: 0, window_ms: 0, reserve: 0 }
      account: { capacity: 0, window_ms: 0, reserve: 0 }
      ledger: { capacity: 0, window_ms: 0, reserve: 0 }
      # X-RateLimit-Requested-Tokens was 1 on every call observed.
      costs: { order: 1, positions: 1, balances: 1, ledger: 1 }

  htx:
    order_answer_timeout_ms: 15000
    rate:
      # Measured 2026-09-06 from ratelimit-limit and ratelimit-interval on
      # api.hbdm.com, which states both outright: 240 in a 3 s window.
      shared: { capacity: 240, window_ms: 3000, reserve: 24 }
      order_entry: { capacity: 0, window_ms: 0, reserve: 0 }
      account: { capacity: 0, window_ms: 0, reserve: 0 }
      ledger: { capacity: 0, window_ms: 0, reserve: 0 }
      costs: { order: 1, positions: 1, balances: 1, ledger: 1 }

  bingx:
    order_answer_timeout_ms: 15000
    # NOT MEASURED. open-api.bingx.com states X-RateLimit-Requests-Remain and
    # X-RateLimit-Requests-Expire and NO capacity, so the ceiling would have to
    # be inferred from where the countdown started — an inference, not a
    # measurement, and this file holds the second kind. Unlimited until bingx
    # states a limit or one is established by driving the counter to zero.
    rate:
      shared: { capacity: 0, window_ms: 0, reserve: 0 }
      order_entry: { capacity: 0, window_ms: 0, reserve: 0 }
      account: { capacity: 0, window_ms: 0, reserve: 0 }
      ledger: { capacity: 0, window_ms: 0, reserve: 0 }
      costs: { order: 1, positions: 1, balances: 1, ledger: 1 }

  bitget:
    order_answer_timeout_ms: 15000
    # NOT MEASURED, for bingx's reason: api.bitget.com states only
    # x-mbx-used-remain-limit — a remainder with neither a ceiling nor a window.
    rate:
      shared: { capacity: 0, window_ms: 0, reserve: 0 }
      order_entry: { capacity: 0, window_ms: 0, reserve: 0 }
      account: { capacity: 0, window_ms: 0, reserve: 0 }
      ledger: { capacity: 0, window_ms: 0, reserve: 0 }
      costs: { order: 1, positions: 1, balances: 1, ledger: 1 }

  weex:
    order_answer_timeout_ms: 15000
    rate:
      # Measured 2026-09-07 from x-remaining-weight-10s and x-used-weight-10s
      # on api-contract.weex.com, which name the window in the header itself:
      # 500 weight in TEN SECONDS, counting back up from 1 after a pause.
      #
      # THE HEADER AND THE BODY DISAGREE and the header wins. exchangeInfo's own
      # `rateLimits` array says REQUEST_WEIGHT / interval MINUTE / intervalNum
      # 10 / limit 500, which reads as 500 per ten MINUTES — sixty times
      # stingier than what the venue actually enforces. Taking the body would
      # throttle this gateway to a call every 1.2 s for no reason.
      #
      # ONE POOL COVERS BOTH HALVES. WEEX meters weight per IP and its market
      # data and its signed reads come out of the same allowance, so `shared` is
      # the only bucket configured and the adapter spends it for both.
      shared: { capacity: 500, window_ms: 10000, reserve: 50 }
      # DELIBERATELY UNCONFIGURED, which reads as unlimited rather than closed.
      # WEEX charges an order ZERO IP weight — "0 on IP rate limit" in its own
      # words — and meters orders per ACCOUNT instead, at 300 a minute from its
      # exchangeInfo `rateLimits`. Nothing in this process counts that budget,
      # and inventing a number for it would refuse traffic the venue accepts.
      order_entry: { capacity: 0, window_ms: 0, reserve: 0 }
      account: { capacity: 0, window_ms: 0, reserve: 0 }
      ledger: { capacity: 0, window_ms: 0, reserve: 0 }
      # NOT WHAT THE SIGNED READS SPEND. Every public call is weight 1, measured
      # by reading x-used-weight-10s before and after each: the 685 KiB
      # exchangeInfo and the 229 KiB premiumIndex cost exactly what the 30-byte
      # clock read does. The private reads cost 2, 5 and 10 depending on the
      # endpoint, which four generic slots cannot express — so they carry the
      # venue's own figure at their call sites in the adapter and none of them
      # reads this line.
      costs: { order: 1, positions: 1, balances: 1, ledger: 1 }
